<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Development 2026 — Halloween wallpaper motion</title>
<style>
  :root{ --ui:#0E1220; --uiText:#E8ECF6; --uiMute:#8A93AD; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ui);color:var(--uiText);font-family:system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
  #viewport{flex:1;position:relative;min-height:0}
  #stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0;background:#000}
  .layer{position:absolute;inset:0}
  svg{display:block}

  /* scene 1 */
  #s1{width:1080px;height:1920px}

  /* phone scenes background */
  #bg{background:radial-gradient(80% 55% at 50% 48%,#2a0c4a 0%,#12061f 55%,#05020a 100%)}
  #bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px)}
  #halo{position:absolute;left:140px;top:240px;width:800px;height:1440px;border-radius:200px;background:radial-gradient(closest-side,rgba(214,60,255,.45),rgba(120,40,255,.12) 60%,transparent);filter:blur(30px)}
  .bar{position:absolute;left:0;height:10px;background:linear-gradient(90deg,transparent,#ff3df2,#3ddcff,transparent);mix-blend-mode:screen;opacity:0}

  /* phone */
  #phone{position:absolute;left:225px;top:290px;width:630px;height:1340px;border-radius:96px;background:linear-gradient(145deg,#4a4a50,#0b0b0d 25%,#050506 70%,#3a3a40);box-shadow:0 0 0 2px rgba(255,255,255,.12),0 40px 90px rgba(0,0,0,.6),0 0 80px rgba(200,60,255,.35);will-change:transform,opacity}
  #screen{position:absolute;left:14px;top:14px;width:602px;height:1312px;border-radius:84px;overflow:hidden;background:#000}
  .wall{position:absolute;inset:0;width:602px;height:1312px}
  #cutout{position:absolute;left:241px;top:26px;width:120px;height:36px;border-radius:18px;background:#000;z-index:5}
  #glass{position:absolute;inset:0;border-radius:84px;z-index:6;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 28%,transparent 42%,transparent 70%,rgba(255,255,255,.06) 100%)}

  #fx{position:absolute;inset:0;pointer-events:none}
  .badge{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);font:600 24px/1 system-ui,sans-serif;color:rgba(255,255,255,.75);background:rgba(0,0,0,.35);padding:10px 20px;border-radius:999px;white-space:nowrap;z-index:30}

  #bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px 16px;background:#151A2B;border-top:1px solid #232A40;font:600 14px/1 system-ui,sans-serif}
  #bar button{font:inherit;color:var(--uiText);background:#232A40;border:1px solid #2F3754;border-radius:9px;padding:9px 12px;cursor:pointer}
  #scrub{flex:1;min-width:140px;accent-color:#b44cff}
  #time{font-variant-numeric:tabular-nums;color:var(--uiMute);min-width:88px}
  .hintbar{color:var(--uiMute);width:100%;font-weight:500}
  body.clean #bar{display:none}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div class="layer" id="L1"><svg id="s1" viewBox="0 -30 600 1067" preserveAspectRatio="xMidYMid slice"></svg></div>
    <div class="layer" id="L2">
      <div class="layer" id="bg"></div>
      <div id="halo"></div>
      <div id="bars"></div>
      <div id="phone"><div id="screen"><div id="walls"></div><div id="cutout"></div><div id="glass"></div></div></div>
    </div>
    <svg id="fx" viewBox="0 0 1080 1920"></svg>
    <div class="badge">For illustration purposes only</div>
  </div>
</div>

<div id="bar">
  <button id="play">Pause</button><button id="restart">Restart</button>
  <input id="scrub" type="range" min="0" max="9600" value="0"><span id="time">0.00 / 9.60 s</span>
  <button id="rec">Record mode</button>
  <div class="hintbar">Full-frame 9:16 creative (not keyed). Record mode / H / ?clean=1 hides controls. Space pause · R restart · ?t=sec to seek.</div>
</div>

<script>
(() => {
  const DUR = 9.6, W = 1080, H = 1920;
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, k) => a + (b - a) * k;
  const outCubic = x => 1 - Math.pow(1 - x, 3);
  const inOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const outBack = (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
  const noise = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

  /* ---------- shared portrait parts (600×1000 local box, face centre ≈ 300,420) ---------- */
  const defs = id => `<defs>
    <filter id="gl${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bl${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <radialGradient id="rg${id}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>`;
  const eye = (cx, o, id) => `<path d="M${cx - 29} 402 Q${cx} 382 ${cx + 29} 402 Q${cx} 418 ${cx - 29} 402 Z" fill="${o.white || '#f4f0f6'}"/>
    <circle cx="${cx}" cy="401" r="11" fill="${o.eye}" filter="url(#gl${id})"/><circle cx="${cx}" cy="401" r="5" fill="#0b0b0b"/><circle cx="${cx + 4}" cy="397" r="2.6" fill="#fff"/>
    <path d="M${cx - 31} 400 Q${cx} 377 ${cx + 31} 400" stroke="#141014" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  const face = (o, id) => `
    <path d="M262 540 L262 655 Q300 676 338 655 L338 540 Z" fill="${o.shade}"/>
    <path d="M200 360 Q200 250 300 248 Q400 250 400 360 Q402 470 352 530 Q326 560 300 562 Q274 560 248 530 Q198 470 200 360 Z" fill="${o.skin}" ${o.op ? `opacity="${o.op}"` : ''}/>
    <path d="M206 380 Q212 470 252 528 Q230 470 226 380 Z" fill="${o.shade}" opacity=".35"/><path d="M394 380 Q388 470 348 528 Q370 470 374 380 Z" fill="${o.shade}" opacity=".45"/>
    <ellipse cx="238" cy="452" rx="26" ry="13" fill="${o.blush || '#ff8fb0'}" opacity=".2"/><ellipse cx="362" cy="452" rx="26" ry="13" fill="${o.blush || '#ff8fb0'}" opacity=".2"/>
    ${o.paint || ''}
    <path d="M222 370 Q252 356 284 366" stroke="${o.brow}" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M378 370 Q348 356 316 366" stroke="${o.brow}" stroke-width="6" fill="none" stroke-linecap="round"/>
    <g class="eyes">${eye(255, o, id)}${eye(345, o, id)}</g>
    <path d="M300 412 Q297 448 290 460 Q300 466 310 460" stroke="${o.shade}" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M272 500 Q286 491 300 496 Q314 491 328 500 Q300 517 272 500 Z" fill="${o.lip}"/>
    <path d="M286 498 Q300 503 314 498" stroke="#fff" stroke-width="2" opacity=".25" fill="none"/>
    ${o.after || ''}`;
  const particles = (n, w, h, col, rmin, rmax, id) => {
    let s = ''; for (let i = 0; i < n; i++) { const x = rnd() * w, y = rnd() * h, r = rmin + rnd() * (rmax - rmin), sp = .4 + rnd() * 1.2; s += `<circle class="p" data-x="${x.toFixed(1)}" data-y="${y.toFixed(1)}" data-s="${sp.toFixed(2)}" data-h="${h}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${col}" filter="url(#gl${id})"/>`; }
    return `<g class="pts">${s}</g>`;
  };

  /* ---------- characters (original designs) ---------- */
  const CH = {
    witch: id => `
      <path class="hairS" d="M300 230 Q180 232 182 380 Q176 560 140 760 Q220 800 262 720 L262 560 L338 560 L338 720 Q380 800 460 760 Q424 560 418 380 Q420 232 300 230 Z" fill="#170d2a"/>
      <path d="M50 1000 Q70 720 236 660 Q300 704 364 660 Q530 720 550 1000 Z" fill="#1a1229"/>
      <path d="M236 660 L300 740 L272 664 Z M364 660 L300 740 L328 664 Z" fill="#5b2a9a"/>
      ${face({ skin: '#efe4f3', shade: '#b79ac8', eye: '#b56cff', lip: '#8a3b7a', brow: '#1b1030' }, id)}
      <path d="M206 342 Q214 270 300 262 Q386 270 394 342 Q362 318 330 336 Q300 308 268 334 Q236 316 206 342 Z" fill="#1d1133"/>
      <ellipse cx="300" cy="272" rx="214" ry="34" fill="#140b22"/>
      <path d="M212 268 Q250 160 330 62 Q346 40 384 50 Q352 72 352 112 Q360 190 390 268 Z" fill="#1a0f2c"/>
      <path d="M216 258 Q300 240 386 258 L390 272 Q300 254 212 272 Z" fill="#8f4dff"/>
      <g class="neon" fill="none" stroke-linecap="round" filter="url(#gl${id})">
        <path pathLength="1" d="M86 272 Q300 220 514 272 Q300 318 86 272" stroke="#b67cff" stroke-width="5"/>
        <path pathLength="1" d="M212 268 Q250 160 330 62 Q346 40 384 50 Q352 72 352 112 Q360 190 390 268" stroke="#4fa8ff" stroke-width="5"/>
        <path pathLength="1" d="M182 380 Q176 560 140 760 Q220 800 262 720" stroke="#b67cff" stroke-width="4"/>
        <path pathLength="1" d="M418 380 Q424 560 460 760 Q380 800 338 720" stroke="#4fa8ff" stroke-width="4"/>
        <path pathLength="1" d="M50 1000 Q70 720 236 660 M550 1000 Q530 720 364 660" stroke="#b67cff" stroke-width="5"/>
      </g>`,
    wizard: id => `
      <path d="M300 196 Q148 206 148 420 Q148 600 210 684 L390 684 Q452 600 452 420 Q452 206 300 196 Z" fill="#1d2546"/>
      <path d="M300 234 Q196 240 194 400 Q196 560 250 622 L350 622 Q404 560 406 400 Q404 240 300 234 Z" fill="#0d1124"/>
      <path d="M44 1000 Q76 720 220 664 L300 724 L380 664 Q524 720 556 1000 Z" fill="#1b2244"/>
      <path d="M220 664 L300 724 L380 664" stroke="#e8b84a" stroke-width="7" fill="none"/>
      ${face({ skin: '#ecc9aa', shade: '#b9876a', eye: '#ffc94a', lip: '#c27a6a', brow: '#3a2618', blush: '#ff9a80' }, id)}
      <path class="hairS" d="M218 344 Q238 272 300 268 Q370 272 386 340 Q350 314 322 334 Q298 302 270 330 Q246 314 218 344 Z" fill="#3b2617"/>
      <circle cx="455" cy="770" r="80" fill="#ffcf5a" opacity=".35" filter="url(#bl${id})" class="glow"/>
      <circle cx="455" cy="770" r="32" fill="#fff1c0" filter="url(#gl${id})" class="glow"/>`,
    vampire: id => `
      <path d="M150 770 L104 360 Q200 520 244 650 Z" fill="#090507"/><path d="M450 770 L496 360 Q400 520 356 650 Z" fill="#090507"/>
      <path d="M160 740 L128 420 Q206 548 240 650 Z" fill="#8e0d20"/><path d="M440 740 L472 420 Q394 548 360 650 Z" fill="#8e0d20"/>
      <path d="M56 1000 Q88 720 238 662 L300 770 L362 662 Q512 720 544 1000 Z" fill="#0d080b"/>
      <path d="M272 690 L300 770 L328 690 L300 706 Z" fill="#b3122a"/>
      ${face({ skin: '#f2e6e4', shade: '#b88f92', eye: '#ff2e46', lip: '#7c1020', brow: '#140a0e', blush: '#ff5070', after: '<path d="M290 504 L294 517 L298 504 Z M302 504 L306 517 L310 504 Z" fill="#fff"/>' }, id)}
      <path class="hairS" d="M204 344 Q206 246 300 238 Q394 246 396 344 Q378 292 330 286 L300 318 L270 286 Q222 292 204 344 Z" fill="#120a10"/>`,
    pumpkin: id => `
      <path d="M40 1000 Q60 700 200 646 L400 646 Q540 700 560 1000 Z" fill="#2a3036"/>
      <ellipse cx="160" cy="720" rx="110" ry="70" fill="#3c444c"/><ellipse cx="440" cy="720" rx="110" ry="70" fill="#3c444c"/>
      <circle cx="120" cy="712" r="7" fill="#8a949e"/><circle cx="480" cy="712" r="7" fill="#8a949e"/>
      <path d="M220 640 Q300 700 380 640 L370 600 L230 600 Z" fill="#163024"/>
      <g class="head">
        <ellipse cx="300" cy="420" rx="168" ry="140" fill="#ff8a1f"/>
        <ellipse cx="300" cy="420" rx="108" ry="140" fill="#f88626"/><ellipse cx="300" cy="420" rx="52" ry="140" fill="#fb9433"/>
        <path d="M300 280 Q296 250 312 232" stroke="#3c5a24" stroke-width="16" fill="none" stroke-linecap="round"/>
        <ellipse cx="300" cy="420" rx="168" ry="140" fill="none" stroke="#c75a0c" stroke-width="4"/>
        <g fill="#ffe680" stroke="#4a1800" stroke-width="6" stroke-linejoin="round" paint-order="stroke" filter="url(#gl${id})" class="glow">
          <path d="M220 400 L262 340 L290 404 Z"/><path d="M380 400 L338 340 L310 404 Z"/><path d="M290 450 L300 430 L310 450 Z"/>
          <path d="M200 476 L232 470 L246 500 L270 480 L300 504 L330 480 L354 500 L368 470 L400 476 Q360 540 300 544 Q240 540 200 476 Z"/>
        </g>
      </g>`,
    ghost: id => `
      <path class="hairS" d="M300 226 Q168 232 174 400 Q168 640 118 920 Q220 890 262 760 L338 760 Q380 890 482 920 Q432 640 426 400 Q432 232 300 226 Z" fill="#eafcff" opacity=".88"/>
      <path d="M60 1000 Q116 760 240 662 L360 662 Q484 760 540 1000 Z" fill="#bfeaf5" opacity=".55"/>
      <g filter="url(#gl${id})" opacity=".95">${face({ skin: '#d8f5fd', shade: '#8fc6d6', eye: '#3df0ff', lip: '#7fb7cf', brow: '#a9dbe8', blush: '#7ff0ff', white: '#e6fbff' }, id)}</g>
      <path d="M210 344 Q224 268 300 262 Q376 268 390 344 Q356 320 326 340 Q300 304 274 340 Q244 320 210 344 Z" fill="#f4feff"/>`,
    jester: id => `
      <path d="M300 194 Q160 204 158 420 Q158 600 214 684 L386 684 Q442 600 442 420 Q440 204 300 194 Z" fill="#3a1652"/>
      <path d="M300 232 Q198 238 196 400 Q198 560 252 622 L348 622 Q402 560 404 400 Q402 238 300 232 Z" fill="#170824"/>
      <path d="M48 1000 Q80 720 222 664 L300 730 L378 664 Q520 720 552 1000 Z" fill="#2a0f3c"/>
      <path d="M222 664 L300 730 L378 664" stroke="#39ff88" stroke-width="6" fill="none"/>
      ${face({ skin: '#f3f0f6', shade: '#a99fb6', eye: '#39ff88', lip: '#2a1030', brow: '#141014', blush: '#b44cff', white: '#0d0d10',
        paint: '<ellipse cx="255" cy="404" rx="40" ry="34" fill="#111"/><ellipse cx="345" cy="404" rx="40" ry="34" fill="#111"/><path d="M300 440 Q290 460 296 468 L304 468 Q310 460 300 440 Z" fill="#111"/>',
        after: '<path d="M262 500 L338 500 M270 492 L270 508 M285 492 L285 508 M300 492 L300 508 M315 492 L315 508 M330 492 L330 508" stroke="#111" stroke-width="3"/>' }, id)}
      <path class="hairS" d="M214 346 Q232 274 300 270 Q368 274 386 346 Q352 320 326 338 Q300 306 274 338 Q248 320 214 346 Z" fill="#120a18"/>`,
  };

  /* ---------- wallpaper environments (602×1312) ---------- */
  const ENV = {
    wizard: id => `<rect width="602" height="1312" fill="#1a1108"/>
      <g filter="url(#bl${id})"><path d="M40 1312 L40 300 Q160 120 280 300 L280 1312 Z" fill="#2c2014"/><path d="M330 1312 L330 300 Q450 120 570 300 L570 1312 Z" fill="#2c2014"/>
      <circle cx="120" cy="420" r="60" fill="#ffb347" opacity=".5"/><circle cx="480" cy="380" r="50" fill="#ffb347" opacity=".45"/><circle cx="300" cy="200" r="70" fill="#ffcf73" opacity=".35"/></g>
      ${particles(34, 602, 1312, '#ffd86a', 1.5, 4, id)}`,
    vampire: id => `<rect width="602" height="1312" fill="url(#vs${id})"/>
      <defs><linearGradient id="vs${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0408"/><stop offset=".6" stop-color="#6e0d16"/><stop offset="1" stop-color="#1a0205"/></linearGradient></defs>
      <circle cx="430" cy="240" r="90" fill="#ffb0a8" opacity=".55" filter="url(#bl${id})"/><circle cx="430" cy="240" r="62" fill="#ffd2cc" opacity=".8"/>
      <path class="bolt" d="M120 80 L160 220 L130 230 L190 420" stroke="#ff4a5e" stroke-width="5" fill="none" filter="url(#gl${id})" opacity="0"/>
      <g fill="#120206"><path d="M90 300 q20 -16 34 0 q14 -16 34 0 q-20 -4 -34 10 q-14 -14 -34 -10z"/><path d="M480 420 q16 -12 27 0 q11 -12 27 0 q-16 -3 -27 8 q-11 -11 -27 -8z"/></g>
      ${particles(24, 602, 1312, '#ff6070', 1.2, 3, id)}`,
    pumpkin: id => `<rect width="602" height="1312" fill="url(#ps${id})"/>
      <defs><linearGradient id="ps${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1a1e"/><stop offset="1" stop-color="#1c3a3a"/></linearGradient></defs>
      <g filter="url(#bl${id})" fill="#061012"><rect x="40" y="0" width="60" height="1312"/><rect x="200" y="0" width="40" height="1312"/><rect x="470" y="0" width="70" height="1312"/></g>
      <g class="fog" fill="#cfe9e6" opacity=".1" filter="url(#bl${id})"><ellipse cx="200" cy="900" rx="300" ry="60"/><ellipse cx="420" cy="1100" rx="300" ry="70"/></g>
      ${particles(28, 602, 1312, '#ff9a3c', 1.2, 3.2, id)}`,
    ghost: id => `<rect width="602" height="1312" fill="url(#gs${id})"/>
      <defs><linearGradient id="gs${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03141a"/><stop offset="1" stop-color="#08323c"/></linearGradient></defs>
      <g fill="#021014" opacity=".9"><path d="M40 1312 L40 1100 Q80 1050 120 1100 L120 1312 Z"/><path d="M470 1312 L470 1080 Q520 1020 570 1080 L570 1312 Z"/></g>
      ${particles(26, 602, 1312, '#6ff6ff', 2, 6, id)}`,
    jester: id => `<rect width="602" height="1312" fill="#0b0612"/>
      <g filter="url(#bl${id})"><circle cx="90" cy="300" r="70" fill="#39ff88" opacity=".45"/><circle cx="520" cy="420" r="90" fill="#b44cff" opacity=".5"/><circle cx="120" cy="980" r="80" fill="#b44cff" opacity=".4"/><circle cx="500" cy="1050" r="70" fill="#39ff88" opacity=".35"/></g>
      ${particles(26, 602, 1312, '#c6ffe0', 1.2, 3, id)}`,
  };
  const ORDER = ['wizard', 'vampire', 'pumpkin', 'ghost', 'jester'];

  /* build scene 1 (witch on black) */
  $('#s1').innerHTML = defs('w') + `<rect x="0" y="-30" width="600" height="1067" fill="#000"/>
    <circle cx="300" cy="420" r="300" fill="#5a1fb0" opacity=".25" filter="url(#blw)" id="witchHalo"/>
    ${particles(40, 600, 1067, '#b98cff', 1.2, 3.4, 'w')}
    <g id="witchTilt">${CH.witch('w')}</g>`;
  /* build wallpapers */
  $('#walls').innerHTML = ORDER.map((k, i) => `<svg class="wall" id="w${i}" viewBox="0 0 602 1312" preserveAspectRatio="xMidYMid slice">${defs(i)}<g class="env">${ENV[k](i)}</g>
    <g transform="translate(-46,250) scale(1.16)"><g class="tilt">${CH[k](i)}</g></g></svg>`).join('');
  const walls = $$('.wall');
  /* fx layer: ripple + flash */
  $('#fx').innerHTML = `<defs><radialGradient id="fl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#d9b8ff"/><stop offset="1" stop-color="#7a3cff" stop-opacity="0"/></radialGradient>
    <filter id="fxg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <g id="rip" filter="url(#fxg)">${[0, 1, 2].map(i => `<ellipse class="rw" cx="630" cy="900" rx="40" ry="40" fill="none" stroke="${i % 2 ? '#4fa8ff' : '#b67cff'}" stroke-width="8"/>`).join('')}
    ${Array.from({ length: 22 }, (_, i) => `<circle class="sp" data-a="${(i / 22 * Math.PI * 2 + rnd() * .3).toFixed(3)}" data-r="${(120 + rnd() * 260).toFixed(0)}" cx="630" cy="900" r="${(3 + rnd() * 5).toFixed(1)}" fill="${i % 2 ? '#9fd0ff' : '#e0c4ff'}"/>`).join('')}</g>
    <circle id="flash" cx="630" cy="900" r="100" fill="url(#fl)" opacity="0"/>`;
  $('#bars').innerHTML = Array.from({ length: 7 }, () => '<div class="bar"></div>').join('');
  const bars = $$('.bar');
  const T0 = 2.8, SW = [3.8, 4.8, 5.8, 6.8]; // wallpaper switch times

  const animPts = (root, t) => root.querySelectorAll('.p').forEach(p => {
    const h = +p.dataset.h, y = ((+p.dataset.y - t * +p.dataset.s * 70) % h + h) % h;
    p.setAttribute('cy', y.toFixed(1)); p.setAttribute('cx', (+p.dataset.x + Math.sin(t * 2 + +p.dataset.y) * 6).toFixed(1));
    p.setAttribute('opacity', (.5 + .5 * Math.sin(t * 3 + +p.dataset.x)).toFixed(2));
  });
  const blink = (root, t, at) => { const k = Math.max(0, 1 - Math.abs(t - at) / .07); root.querySelectorAll('.eyes').forEach(e => e.setAttribute('transform', `translate(0,401) scale(1,${1 - .9 * k}) translate(0,-401)`)); };

  function render(t) {
    /* ---------- scene 1 + touch (0–2.8) ---------- */
    const on1 = t < 3.1;
    $('#L1').style.display = on1 ? '' : 'none';
    if (on1) {
      const s1 = $('#s1'), a = seg(t, 0, .9);
      s1.style.opacity = a;
      $('#witchTilt').setAttribute('transform', `translate(0,${(1 - outCubic(a)) * 30}) rotate(${Math.sin(t * 1.6) * 1.6} 300 620)`);
      const neon = seg(t, .25, 1.5);
      s1.querySelectorAll('.neon path').forEach((p, i) => { p.setAttribute('stroke-dasharray', '1'); p.setAttribute('stroke-dashoffset', (1 - outCubic(clamp(neon * 1.3 - i * .08))).toFixed(3)); p.setAttribute('opacity', (.85 + .15 * Math.sin(t * 9 + i)).toFixed(2)); });
      $('#witchHalo').setAttribute('opacity', (.15 + .2 * neon + .05 * Math.sin(t * 4)).toFixed(2));
      animPts(s1, t); blink(s1, t, 1.2);
    }
    // ripple (touch at 1.9), sparks, flash (2.45–2.8) then fade (2.8–3.1)
    const rk = seg(t, 1.9, 2.7);
    $$('.rw').forEach((r, i) => { const k = clamp(rk * 1.4 - i * .18); r.setAttribute('rx', 40 + 520 * outCubic(k)); r.setAttribute('ry', 40 + 520 * outCubic(k)); r.setAttribute('opacity', k > 0 && k < 1 ? (1 - k).toFixed(2) : 0); });
    const sk = seg(t, 1.9, 2.5);
    $$('.sp').forEach(s => { const d = +s.dataset.r * outCubic(sk); s.setAttribute('cx', 630 + Math.cos(+s.dataset.a) * d); s.setAttribute('cy', 900 + Math.sin(+s.dataset.a) * d); s.setAttribute('opacity', sk > 0 && sk < 1 ? (1 - sk).toFixed(2) : 0); });
    const dot = Math.max(0, 1 - Math.abs(t - 1.9) / .12); // tiny contact glow
    const fIn = seg(t, 2.4, 2.8), fOut = seg(t, 2.8, 3.15);
    $('#flash').setAttribute('r', 100 + 2200 * inOutCubic(fIn) + 40 * dot);
    $('#flash').setAttribute('opacity', Math.max(dot * .8, fIn > 0 ? (1 - fOut) : 0).toFixed(2));

    /* ---------- phone scenes (2.8–9.6) ---------- */
    const on2 = t >= 2.7;
    $('#L2').style.display = on2 ? '' : 'none';
    if (on2) {
      const out = seg(t, 8.75, 9.3), ph = $('#phone');
      const settle = outBack(seg(t, 2.8, 3.3), 1.6);
      const flick = out > 0 && out < 1 ? (noise(Math.floor(t * 30)) > .5 ? .3 : 1) : 1;
      ph.style.opacity = (1 - out) * flick;
      ph.style.transform = `perspective(2400px) rotateY(${-6 + Math.sin(t * .9) * 1.5}deg) rotateX(${3 + Math.sin(t * .7) * 1}deg) scale(${(1.06 - .06 * settle) * (1 - .1 * out)})`;
      $('#halo').style.opacity = (.75 + .25 * Math.sin(t * 2.4)) * (1 - out);
      $('#bg').style.opacity = 1 - out;
      // which wallpaper
      let cur = 0; SW.forEach((s, i) => { if (t >= s) cur = i + 1; });
      const since = cur ? t - SW[cur - 1] : 9, tr = clamp(since / .3);
      walls.forEach((w, i) => {
        const vis = i === cur || (i === cur - 1 && tr < 1);
        w.style.display = vis ? '' : 'none';
        if (!vis) return;
        if (i === cur && cur > 0 && tr < 1) {
          const j = (noise(Math.floor(t * 40) + i) - .5) * 40 * (1 - tr);
          w.style.clipPath = `inset(0 0 ${((1 - inOutCubic(tr)) * 100).toFixed(1)}% 0)`;
          w.style.transform = `translateX(${j.toFixed(1)}px)`;
          w.style.filter = `hue-rotate(${((1 - tr) * 90).toFixed(0)}deg) saturate(${1 + (1 - tr)}) brightness(${1 + .6 * (1 - tr)})`;
        } else { w.style.clipPath = ''; w.style.transform = ''; w.style.filter = ''; }
        const lt = t - (i ? SW[i - 1] : T0);
        w.querySelector('.tilt').setAttribute('transform', `rotate(${Math.sin(lt * 1.8) * 2.2} 300 640) translate(${Math.sin(lt * 1.2) * 4},0)`);
        w.querySelector('.env').setAttribute('transform', `translate(${-Math.sin(lt * 1.2) * 8},0)`);
        w.querySelectorAll('.hairS').forEach(h => h.setAttribute('transform', `skewX(${Math.sin(lt * 2.6) * 1.8})`));
        w.querySelectorAll('.glow').forEach(g => g.setAttribute('opacity', (.7 + .3 * Math.sin(lt * 6)).toFixed(2)));
        const bolt = w.querySelector('.bolt'); if (bolt) bolt.setAttribute('opacity', (lt % .6 < .08 ? 1 : 0));
        const fog = w.querySelector('.fog'); if (fog) fog.setAttribute('transform', `translate(${Math.sin(lt) * 30},0)`);
        animPts(w, t); blink(w, t, (i ? SW[i - 1] : T0) + .65);
      });
      // glitch bars: strong at switches, light otherwise
      const near = Math.max(...SW.map(s => Math.max(0, 1 - Math.abs(t - s - .1) / .25)), Math.max(0, 1 - Math.abs(t - 2.85) / .3), out > 0 && out < 1 ? 1 : 0);
      bars.forEach((b, i) => {
        const n = noise(Math.floor(t * 18) * 7 + i);
        b.style.top = (n * 1920).toFixed(0) + 'px'; b.style.width = (300 + noise(i + Math.floor(t * 18)) * 900).toFixed(0) + 'px';
        b.style.left = (noise(i * 3 + Math.floor(t * 18)) * 400 - 100).toFixed(0) + 'px';
        b.style.height = (4 + n * 16).toFixed(0) + 'px';
        b.style.opacity = (n > .55 ? .15 + .85 * near : near * .3).toFixed(2);
      });
    }
  }

  /* ---------- playback + controls ---------- */
  const qs = new URLSearchParams(location.search);
  let t = qs.has('t') ? clamp(+qs.get('t'), 0, DUR) : 0, playing = !qs.has('t'), last = null;
  const loop = qs.get('loop') !== '0';
  const stage = $('#stage');
  function fit() {
    const vp = $('#viewport').getBoundingClientRect(), s = Math.min(vp.width / W, vp.height / H);
    stage.style.transform = `translate(${(vp.width - W * s) / 2}px,${(vp.height - H * s) / 2}px) scale(${s})`;
    render(t);
  }
  const setClean = on => { document.body.classList.toggle('clean', on); document.body.style.background = on ? '#000' : ''; fit(); };
  const ui = () => { $('#scrub').value = Math.round(t * 1000); $('#time').textContent = `${t.toFixed(2)} / ${DUR.toFixed(2)} s`; $('#play').textContent = playing ? 'Pause' : 'Play'; };
  function frame(now) {
    if (playing && last != null) { t += (now - last) / 1000; if (t >= DUR) { if (loop) t %= DUR; else { t = DUR; playing = false; } } }
    last = now; render(t); ui(); requestAnimationFrame(frame);
  }
  $('#play').onclick = () => { playing = !playing; };
  $('#restart').onclick = () => { t = 0; playing = true; };
  $('#scrub').oninput = e => { t = e.target.value / 1000; playing = false; };
  $('#rec').onclick = () => { t = 0; playing = true; setClean(true); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing = !playing; }
    else if (e.key === 'r' || e.key === 'R') { t = 0; playing = true; }
    else if (e.key === 'h' || e.key === 'H') setClean(!document.body.classList.contains('clean'));
  });
  addEventListener('resize', fit);
  window.__motion = { seek: v => { t = clamp(v, 0, DUR); playing = false; render(t); }, DUR };
  setClean(qs.get('clean') === '1');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
