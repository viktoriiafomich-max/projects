<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banking card app — motion</title>
<style>
  :root { --font: "SF Pro Rounded", "Arial Rounded MT Bold", "Arial Black", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #040a1c; font-family: var(--font); overflow: hidden; }
  #wrap { position: absolute; left: 0; top: 0; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; }

  #bg { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 55% at 50% 42%, #10285e 0%, #081740 45%, #040a1c 100%); }
  #gridWrap { position: absolute; left: -540px; right: -540px; top: 980px; height: 1400px; perspective: 700px; perspective-origin: 50% 0; }
  #grid { position: absolute; inset: 0; transform: rotateX(72deg); transform-origin: 50% 0;
    background-image: linear-gradient(rgba(90,160,255,.55) 2px, transparent 2px), linear-gradient(90deg, rgba(90,160,255,.55) 2px, transparent 2px);
    background-size: 120px 120px;
    -webkit-mask: linear-gradient(180deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 85%); mask: linear-gradient(180deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 85%); }
  #horizon { position: absolute; left: 0; right: 0; top: 960px; height: 80px; background: radial-gradient(ellipse 60% 100% at 50% 50%, rgba(90,170,255,.45), rgba(90,170,255,0) 70%); }
  #fade { position: absolute; inset: 0; background: #040a1c; }
  #stage.bg-magenta #bgall, #stage.bg-green #bgall, #stage.bg-black #bgall, #stage.bg-checker #bgall { display: none; }
  #stage.bg-magenta { background: #FF00FF; } #stage.bg-green { background: #00FF00; } #stage.bg-black { background: #000; }
  #stage.bg-checker { background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0/60px 60px; }
  #stage.key .sh { filter: none !important; box-shadow: none !important; }

  #world { position: absolute; inset: 0; transform-origin: 540px 860px; }
  #glow { position: absolute; left: 160px; top: 330px; width: 760px; height: 1060px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(70,150,255,.5), rgba(70,150,255,0) 62%); }
  .geo { position: absolute; border: 4px solid rgba(120,190,255,.55); box-shadow: 0 0 18px rgba(90,160,255,.4); }
  .pt { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #9fd0ff; box-shadow: 0 0 10px rgba(120,190,255,.9); }

  /* phone */
  .space { position: absolute; inset: 0; perspective: 2400px; perspective-origin: 540px 860px; }
  .p3 { position: absolute; left: 330px; top: 420px; width: 420px; height: 880px; transform-style: preserve-3d; }
  .face, .slice { position: absolute; inset: 0; border-radius: 70px; }
  .slice { background: linear-gradient(90deg, #1b1e25, #4a4f5a 36%, #b8c0cc 50%, #4a4f5a 64%, #1b1e25); }
  .face { backface-visibility: hidden; overflow: hidden; }
  .back { background: linear-gradient(165deg, #3a3e47, #16181d); }
  .front { background: linear-gradient(135deg, #c3cad6, #4a4f5a 30%, #1b1e25); }
  .bez { position: absolute; inset: 4px; border-radius: 66px; background: #020306; }
  .scr { position: absolute; inset: 15px; border-radius: 56px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 0%, #2a64e0 0%, rgba(42,100,224,0) 55%), linear-gradient(180deg, #0d2257 0%, #0a1838 60%, #071029 100%); }
  .isl { position: absolute; left: 50%; top: 30px; width: 124px; height: 36px; margin-left: -62px; border-radius: 18px; background: #000; z-index: 9; }
  .glare { position: absolute; inset: 15px; border-radius: 56px; background: linear-gradient(125deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 28%); z-index: 8; pointer-events: none; }
  #scrDark { position: absolute; inset: 0; background: #02040c; z-index: 7; }

  /* app UI (screen coords 390 x 850) */
  .bcard { position: absolute; left: 30px; top: 230px; width: 330px; height: 208px; border-radius: 24px; overflow: hidden;
    box-shadow: 0 18px 30px rgba(0,0,0,.45); }
  #cardA { background: radial-gradient(circle at 80% 20%, rgba(255,210,120,.85) 0, rgba(255,210,120,0) 32%), radial-gradient(circle at 15% 90%, rgba(80,150,255,.8) 0, rgba(80,150,255,0) 40%), linear-gradient(135deg, #14151b, #23252f 60%, #14151b); }
  #cardA .wave { position: absolute; left: -20%; top: 50%; width: 140%; height: 70%; border-radius: 50%; border-top: 3px solid rgba(255,214,140,.7); transform: rotate(-12deg); }
  #cardA .wave2 { position: absolute; left: -30%; top: 62%; width: 160%; height: 70%; border-radius: 50%; border-top: 2px solid rgba(120,180,255,.6); transform: rotate(-8deg); }
  #cardB { background: radial-gradient(circle at 25% 25%, rgba(120,200,255,.8) 0, rgba(120,200,255,0) 40%), linear-gradient(135deg, #1a4fc4, #0f2a73); }
  .chip { position: absolute; left: 26px; top: 64px; width: 48px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #f3d48a, #b8913f); }
  .nfc { position: absolute; left: 88px; top: 70px; width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255,255,255,.55); border-left-color: transparent; border-bottom-color: transparent; transform: rotate(45deg); }
  .dots { position: absolute; left: 26px; bottom: 26px; display: flex; gap: 8px; }
  .dots i { width: 34px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.35); }
  .mark { position: absolute; right: 22px; bottom: 20px; width: 64px; height: 40px; }
  .mark::before, .mark::after { content: ""; position: absolute; top: 0; width: 40px; height: 40px; border-radius: 50%; }
  .mark::before { left: 0; background: rgba(255,214,140,.85); } .mark::after { right: 0; background: rgba(120,180,255,.75); mix-blend-mode: screen; }
  .shine { position: absolute; top: -30%; left: -50%; width: 35%; height: 160%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.45), rgba(255,255,255,0)); transform: rotate(18deg); }
  #edge { position: absolute; inset: -4px; border-radius: 28px; border: 4px solid #58b2ff; box-shadow: 0 0 24px rgba(88,178,255,.95); opacity: 0; }

  .nav { position: absolute; left: 24px; right: 24px; bottom: 24px; height: 96px; border-radius: 36px; background: rgba(255,255,255,.08); display: flex; justify-content: space-around; align-items: center; }
  .nav b { width: 40px; height: 40px; border-radius: 12px; border: 4px solid rgba(160,200,255,.75); }
  .nav b.c { border-radius: 50%; } .nav b.on { border-color: #fff; background: rgba(88,178,255,.35); }

  .track { position: absolute; left: 45px; width: 300px; height: 18px; border-radius: 9px; background: #0a1430; box-shadow: inset 0 2px 4px rgba(0,0,0,.6); }
  .track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9px; background: linear-gradient(90deg, #2f7dff, #6cc5ff); box-shadow: 0 0 14px rgba(90,170,255,.8); }
  .track .h { position: absolute; top: -13px; width: 44px; height: 44px; margin-left: -22px; border-radius: 50%; background: #fff; box-shadow: 0 6px 12px rgba(0,0,0,.45), 0 0 0 6px rgba(255,255,255,.12); }
  .trIcon { position: absolute; left: 45px; width: 26px; height: 26px; border-radius: 8px; border: 4px solid rgba(160,200,255,.7); }
  #conf { position: absolute; left: 85px; top: 590px; width: 220px; height: 72px; border-radius: 36px; background: linear-gradient(180deg, #3d7bff, #2152c9);
    box-shadow: 0 10px 22px rgba(33,82,201,.5); display: flex; align-items: center; justify-content: center; }
  #conf i { width: 34px; height: 34px; border-radius: 50%; border: 5px solid #fff; position: relative; }
  #conf i::after { content: ""; position: absolute; left: 6px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  #confG { position: absolute; inset: 0; border-radius: 36px; background: linear-gradient(180deg, #39d98a, #17a862); box-shadow: 0 0 30px rgba(57,217,138,.9); opacity: 0; display: flex; align-items: center; justify-content: center; }
  #confG i { width: 34px; height: 34px; border-radius: 50%; border: 5px solid #fff; position: relative; }
  #confG i::after { content: ""; position: absolute; left: 6px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: #fff; }

  #notif { position: absolute; left: 22px; right: 22px; top: 64px; height: 104px; border-radius: 32px; background: rgba(255,255,255,.16);
    border: 1.5px solid rgba(255,255,255,.3); box-shadow: 0 14px 30px rgba(0,0,0,.4); z-index: 6; }
  #notif .ci { position: absolute; left: 22px; top: 22px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #3d7bff, #6cc5ff); }
  #notif .ci::after { content: ""; position: absolute; left: 14px; top: 20px; width: 32px; height: 21px; border-radius: 5px; border: 4px solid #fff; }
  #notif .ln { position: absolute; left: 100px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.45); }
  #notif .ind { position: absolute; right: 26px; top: 38px; width: 28px; height: 28px; border-radius: 50%; background: #39d98a; box-shadow: 0 0 18px rgba(57,217,138,.9); }
  #pulse { position: absolute; left: -10%; width: 120%; height: 160px; background: linear-gradient(180deg, rgba(57,217,138,0), rgba(57,217,138,.4), rgba(57,217,138,0)); z-index: 5; }

  #disc { position: absolute; left: 50%; top: 1560px; transform: translateX(-50%); padding: 12px 26px; border-radius: 26px;
    background: rgba(255,255,255,.14); color: rgba(255,255,255,.88); font-size: 28px; font-weight: 800; white-space: nowrap; }

  #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; background: #111; color: #eee; display: flex; align-items: center; gap: 12px; padding: 0 16px; font: 14px system-ui, sans-serif; }
  #ui button, #ui select { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  #ui input[type=range] { flex: 1; }
  body.clean #ui { display: none; }
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <div id="bgall"><div id="bg"></div><div id="gridWrap"><div id="grid"></div></div><div id="horizon"></div></div>

  <div id="world">
    <div id="glow"></div>
    <div class="geo" id="g1" style="left:130px;top:420px;width:90px;height:90px;border-radius:50%"></div>
    <div class="geo" id="g2" style="left:880px;top:560px;width:70px;height:70px;border-radius:16px"></div>
    <div class="geo" id="g3" style="left:860px;top:1180px;width:110px;height:110px;border-radius:50%"></div>
    <div class="geo" id="g4" style="left:120px;top:1150px;width:60px;height:60px;border-radius:14px"></div>
    <div id="pts"></div>

    <div class="space"><div class="p3" id="ph">
      <div class="face back"></div>
      <div class="face front"><div class="bez"></div>
        <div class="scr" id="scr">
          <div id="notif"><div class="ci"></div><div class="ln" style="top:32px;width:150px"></div><div class="ln" style="top:58px;width:100px;background:rgba(255,255,255,.28)"></div><div class="ind"></div></div>
          <div class="bcard" id="cardB"><div class="chip"></div><div class="dots"><i></i><i></i><i></i></div></div>
          <div class="bcard" id="cardA"><div class="wave"></div><div class="wave2"></div><div class="chip"></div><div class="nfc"></div><div class="dots"><i></i><i></i><i></i></div><div class="mark"></div><div class="shine" id="shine"></div><div id="edge"></div></div>
          <div class="trIcon" style="top:384px"></div><div class="track" id="tr1" style="top:424px"><div class="fill"></div><div class="h"></div></div>
          <div class="trIcon" style="top:474px;border-radius:50%"></div><div class="track" id="tr2" style="top:514px"><div class="fill"></div><div class="h"></div></div>
          <div id="conf"><i></i><div id="confG"><i></i></div></div>
          <div class="nav" id="nav"><b class="on"></b><b class="c"></b><b></b><b class="c"></b></div>
          <div id="pulse"></div>
          <div id="scrDark"></div>
        </div>
        <div class="isl"></div><div class="glare"></div>
      </div>
    </div></div>
  </div>

  <div id="fade"></div>
  <div id="disc">For illustration purposes only</div>
</div>
</div>

<div id="ui">
  <button id="bPlay">Pause</button><button id="bRe">Restart</button>
  <input id="scrub" type="range" min="0" max="15.5" step="0.001" value="0"><span id="time">0.00</span>
  <select id="bgSel"><option value="scene">scene</option><option value="magenta">magenta</option><option value="green">green</option><option value="black">black</option><option value="checker">checker</option></select>
  <button id="bClean">Clean (H)</button>
</div>

<script>
(() => {
  const DUR = 15.5;
  const $ = s => document.querySelector(s);
  const el = id => document.getElementById(id);
  const stage = $('#stage'), world = $('#world'), wrap = $('#wrap');
  const q = new URLSearchParams(location.search);

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eOut = p => 1 - Math.pow(1 - p, 3);
  const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const eOutBack = p => { const c = 1.5, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

  // phone edge slices
  const ph = el('ph'), D = 30, N = 12;
  for (let i = 0; i < N; i++) { const s = document.createElement('div'); s.className = 'slice'; s.style.transform = `translateZ(${-D / 2 + D * (i + .5) / N}px)`; ph.insertBefore(s, ph.firstChild); }
  ph.querySelector('.back').style.transform = `rotateY(180deg) translateZ(${D / 2 + .5}px)`;
  ph.querySelector('.front').style.transform = `translateZ(${D / 2 + .5}px)`;

  const PT = Array.from({ length: 22 }, (_, i) => { const d = document.createElement('div'); d.className = 'pt'; el('pts').appendChild(d);
    return { el: d, x: 80 + (i * 173) % 920, y: 300 + (i * 211) % 1250, sp: 14 + (i * 7) % 20, ph: i * .7 }; });

  const setTrack = (tr, v) => { tr.querySelector('.fill').style.width = (v * 100) + '%'; tr.querySelector('.h').style.left = (v * 300) + 'px'; };

  function render(t) {
    // camera: push in at start, pull back at the end
    const cam = lerp(.9, 1.04, eInOut(seg(t, 0, 2.2))) * lerp(1, .9, eInOut(seg(t, 12.0, 14.8)));
    world.style.transform = `scale(${cam})`;
    el('fade').style.opacity = Math.max(1 - eOut(seg(t, 0, .7)), eInOut(seg(t, 14.8, 15.5)));
    // grid appears and drifts backward
    el('gridWrap').style.opacity = eOut(seg(t, .1, 1.0));
    el('grid').style.backgroundPosition = `0 ${-(t * 40 + 60 * eInOut(seg(t, 12, 15.5)) * 4) % 120}px`;
    el('horizon').style.opacity = eOut(seg(t, .3, 1.2));
    el('glow').style.opacity = eOut(seg(t, 1.0, 2.0)) * (.75 + .25 * Math.sin(t * 1.2)) * (1 + .3 * eInOut(seg(t, 13, 14.5)));
    ['g1', 'g2', 'g3', 'g4'].forEach((id, i) => {
      const g = el(id); g.style.opacity = eOut(seg(t, .8 + i * .15, 1.6 + i * .15)) * .9;
      g.style.transform = `translateY(${Math.sin(t * .9 + i * 1.6) * 16}px) rotate(${t * (i % 2 ? -14 : 10)}deg)`;
    });
    PT.forEach(o => { o.el.style.left = (o.x + Math.sin(t * .6 + o.ph) * 30) + 'px'; o.el.style.top = (o.y - (t * o.sp) % 260) + 'px'; o.el.style.opacity = (.35 + .35 * Math.sin(t * 2 + o.ph)) * eOut(seg(t, 1, 2)); });

    // phone rises and floats
    const rise = eOutBack(seg(t, .3, 1.5));
    const sway = Math.sin(t * .8) * 4;
    ph.style.transform = `translateY(${lerp(1100, 0, clamp(rise, 0, 1.1)) + Math.sin(t * 1.3) * 6}px) rotateY(${lerp(-14, 0, eOut(seg(t, .3, 2))) + sway}deg) rotateX(${lerp(10, 3, eOut(seg(t, .3, 2)))}deg)`;
    el('scrDark').style.opacity = 1 - eOut(seg(t, 1.2, 1.7));
    el('nav').querySelectorAll('b').forEach((b, i) => { const p = eOutBack(seg(t, 1.5 + i * .07, 1.85 + i * .07)); b.style.transform = `scale(${clamp(p, 0, 1.2)})`; });
    el('nav').style.opacity = eOut(seg(t, 1.4, 1.6));

    // card A slides in, expands; card B slides behind
    const A = el('cardA'), B = el('cardB');
    const ain = eOutBack(seg(t, 1.7, 2.15));
    const aExp = eOutBack(seg(t, 2.1, 2.6));
    const aUp = eInOut(seg(t, 4.0, 4.6));
    const aPulse = Math.sin(Math.PI * seg(t, 7.0, 8.2));
    A.style.opacity = clamp(seg(t, 1.7, 1.85));
    A.style.transform = `translateX(${lerp(420, 0, clamp(ain, 0, 1.1))}px) translateY(${lerp(0, -60, aUp)}px) scale(${lerp(1, 1.1, clamp(aExp, 0, 1.1)) * lerp(1, .82 / 1.1, aUp) * (1 + .05 * aPulse)})`;
    A.style.zIndex = 3;
    A.style.boxShadow = `0 18px 30px rgba(0,0,0,.45), 0 0 ${30 * aPulse}px rgba(88,178,255,${.8 * aPulse})`;
    const bin = eOut(seg(t, 2.45, 2.95)), bout = eInOut(seg(t, 4.0, 4.4));
    B.style.opacity = clamp(seg(t, 2.45, 2.6)) * (1 - bout) * .95;
    B.style.transform = `translateX(${lerp(-420, -96, bin) + lerp(0, -60, bout)}px) translateY(-46px) scale(${.94 * lerp(1, .9, bout)}) rotate(${lerp(-6, -4, bin)}deg)`;
    B.style.zIndex = 2;
    el('edge').style.opacity = eOut(seg(t, 2.95, 3.25)) * (1 - eInOut(seg(t, 4.0, 4.4))) + .8 * aPulse;
    el('shine').style.left = lerp(-50, 140, eInOut(seg(t, 3.0, 3.8))) + '%';

    // sliders + confirmation
    const sIn = eOut(seg(t, 4.5, 4.9));
    ['tr1', 'tr2'].forEach(id => { el(id).style.opacity = sIn; el(id).style.transform = `translateY(${lerp(24, 0, sIn)}px)`; });
    document.querySelectorAll('.trIcon').forEach(e => e.style.opacity = sIn);
    const demo = Math.sin(Math.PI * seg(t, 4.9, 5.7)) * .12;
    const v1 = .2 + demo + .65 * eInOut(seg(t, 6.2, 7.6));
    const v2 = .2 + demo * .7 + .5 * eInOut(seg(t, 6.6, 8.0));
    setTrack(el('tr1'), v1); setTrack(el('tr2'), v2);
    const cIn = eOutBack(seg(t, 5.3, 5.7));
    const conf = el('conf');
    conf.style.opacity = clamp(seg(t, 5.3, 5.45));
    conf.style.transform = `scale(${clamp(cIn, 0, 1.15) * (1 + .06 * Math.sin(Math.PI * seg(t, 8.3, 8.8)))})`;
    el('confG').style.opacity = eInOut(seg(t, 8.3, 8.7));

    // notification + green pulse
    const nIn = eOutBack(seg(t, 9.2, 9.7));
    const nt = el('notif');
    nt.style.opacity = clamp(seg(t, 9.2, 9.35));
    nt.style.transform = `translateY(${lerp(-160, 0, clamp(nIn, 0, 1.1))}px)`;
    nt.querySelector('.ind').style.transform = `scale(${eOutBack(seg(t, 9.6, 9.9))})`;
    nt.querySelectorAll('.ln').forEach((l, i) => l.style.transform = `scaleX(${eOut(seg(t, 9.7 + i * .1, 10.0 + i * .1))})`);
    nt.querySelectorAll('.ln').forEach(l => l.style.transformOrigin = '0 50%');
    const pp = seg(t, 10.2, 11.0);
    el('pulse').style.top = lerp(-180, 880, eInOut(pp)) + 'px';
    el('pulse').style.opacity = pp > 0 && pp < 1 ? 1 : 0;
    el('scr').style.filter = `brightness(${1 + .12 * eInOut(seg(t, 10.4, 11.4))})`;
  }

  // ---- layout / controls ----
  let S = 1;
  let T = clamp(+(q.get('t') || 0), 0, DUR), playing = !q.has('t'), loop = q.get('loop') !== '0', clean = q.get('clean') === '1';
  const setBg = v => { stage.className = 'bg-' + v + ((v === 'scene' || v === 'checker') ? '' : ' key'); document.body.style.background = clean ? ({ scene: '#040a1c', magenta: '#FF00FF', green: '#00FF00', black: '#000', checker: '#ccc' }[v]) : '#040a1c'; $('#bgSel').value = v; };
  const layout = () => {
    document.body.classList.toggle('clean', clean);
    const W = innerWidth, H = innerHeight - (clean ? 0 : 64);
    S = Math.min(W / 1080, H / 1920);
    stage.style.transform = `scale(${S})`;
    wrap.style.width = 1080 * S + 'px'; wrap.style.height = 1920 * S + 'px';
    wrap.style.left = (W - 1080 * S) / 2 + 'px'; wrap.style.top = (H - 1920 * S) / 2 + 'px';
    setBg($('#bgSel').value || 'scene');
    render(T);
  };
  $('#bgSel').value = q.get('bg') || 'scene';
  addEventListener('resize', layout);
  const ui = () => { $('#scrub').value = T; $('#time').textContent = T.toFixed(2); $('#bPlay').textContent = playing ? 'Pause' : 'Play'; };
  $('#bPlay').onclick = () => { playing = !playing; ui(); };
  $('#bRe').onclick = () => { T = 0; playing = true; ui(); render(T); };
  $('#scrub').oninput = e => { T = +e.target.value; playing = false; ui(); render(T); };
  $('#bgSel').onchange = e => { setBg(e.target.value); render(T); };
  $('#bClean').onclick = () => { clean = !clean; layout(); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { playing = !playing; ui(); e.preventDefault(); }
    if (e.key === 'r' || e.key === 'R') $('#bRe').onclick();
    if (e.key === 'h' || e.key === 'H') { clean = !clean; layout(); }
  });
  let last = null;
  const tick = now => {
    if (last != null && playing) {
      T += (now - last) / 1000;
      if (T >= DUR) { if (loop) T %= DUR; else { T = DUR; playing = false; } }
      render(T); ui();
    }
    last = now; requestAnimationFrame(tick);
  };
  layout(); ui();
  requestAnimationFrame(tick);

  let fontsOk = false;
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fontsOk = true; render(T); });
  window.__motion = { seek(t) { T = clamp(t, 0, DUR); playing = false; render(T); }, DUR, get ready() { return fontsOk; } };
})();
