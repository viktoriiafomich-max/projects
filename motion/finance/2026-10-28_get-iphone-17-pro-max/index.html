<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone upgrade — motion</title>
<style>
  :root { --font: "SF Pro Rounded", "Arial Rounded MT Bold", "Arial Black", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #05081a; font-family: var(--font); overflow: hidden; }
  #wrap { position: absolute; left: 0; top: 0; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; }

  #bg { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 55% at 50% 44%, #13234d 0%, #0a1330 45%, #04071a 100%); }
  #bgGlow { position: absolute; left: 140px; top: 360px; width: 800px; height: 1000px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(64,124,255,.32), rgba(64,124,255,0) 65%); }
  #floor { position: absolute; left: 0; right: 0; top: 1290px; height: 630px;
    background: linear-gradient(180deg, rgba(40,70,140,.0) 0%, rgba(30,52,110,.35) 6%, rgba(8,14,36,.9) 60%, #04071a 100%); }
  #floorLine { position: absolute; left: 90px; right: 90px; top: 1290px; height: 2px;
    background: linear-gradient(90deg, rgba(120,170,255,0), rgba(140,190,255,.7), rgba(120,170,255,0)); }
  #stage.bg-magenta #bgall, #stage.bg-green #bgall, #stage.bg-black #bgall, #stage.bg-checker #bgall { display: none; }
  #stage.bg-magenta { background: #FF00FF; } #stage.bg-green { background: #00FF00; } #stage.bg-black { background: #000; }
  #stage.bg-checker { background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0/60px 60px; }
  #stage.key .sh { filter: none !important; box-shadow: none !important; }

  #world { position: absolute; inset: 0; transform-origin: 540px 860px; }
  #beam { position: absolute; left: 0; top: -400px; width: 300px; height: 2800px; transform-origin: 150px 1400px;
    background: linear-gradient(90deg, rgba(150,190,255,0), rgba(170,205,255,.30), rgba(150,190,255,0)); mix-blend-mode: screen; }

  /* 3D space */
  #space { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 540px 860px; }
  #p3 { position: absolute; left: 330px; top: 420px; width: 420px; height: 880px; transform-style: preserve-3d;
    --f1: #dfe3e8; --f2: #8c939c; --fr: #b9bfc7; --fd: #6c727b; }
  .face, .slice { position: absolute; inset: 0; border-radius: 66px; }
  .slice { background: linear-gradient(90deg, var(--fd), var(--fr) 40%, #f4f6f8 52%, var(--fr) 64%, var(--fd)); }
  .face { backface-visibility: hidden; overflow: hidden; }
  .back { background: linear-gradient(160deg, var(--f1) 0%, var(--f2) 100%); }
  .back .brush { position: absolute; inset: 0; opacity: .18;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.5) 0 1px, rgba(0,0,0,0) 1px 4px); }
  .back .sheen, .front .sheen { position: absolute; inset: -40%; background: linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.55) 48%, rgba(255,255,255,0) 58%); }
  .module { position: absolute; left: 26px; top: 26px; width: 206px; height: 214px; border-radius: 52px;
    background: linear-gradient(150deg, rgba(255,255,255,.28), rgba(0,0,0,.18)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25), 0 6px 14px rgba(0,0,0,.25); }
  .lens { position: absolute; width: 84px; height: 84px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #0b1020 0 26%, #1c2b55 30%, #050811 44%, #2a2f38 46%, #11141a 60%, #6a717c 64%, #2b3038 72%, #c9ced6 76%, #6b717a 100%);
    box-shadow: 0 4px 8px rgba(0,0,0,.45); }
  .lens::after { content: ""; position: absolute; left: 28px; top: 22px; width: 14px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.55); transform: rotate(-30deg); }
  .flash { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle, #fff6dc, #d9c79a 70%, #8a7f66); }
  .mic { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #2a2f38; }
  .front { background: #050608; }
  .front .scr { position: absolute; inset: 14px; border-radius: 54px; overflow: hidden;
    background: radial-gradient(ellipse 70% 50% at 30% 30%, #3a6cff 0%, rgba(58,108,255,0) 60%),
                radial-gradient(ellipse 60% 45% at 75% 75%, #1636a8 0%, rgba(22,54,168,0) 65%),
                linear-gradient(170deg, #0b1844 0%, #050816 55%, #0a1a52 100%); }
  .front .wave { position: absolute; left: -20%; top: 40%; width: 140%; height: 34%; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(110,160,255,.55), rgba(110,160,255,0) 60%); transform: rotate(-18deg); }
  .front .isl { position: absolute; left: 50%; top: 30px; width: 120px; height: 34px; margin-left: -60px; border-radius: 18px; background: #000; }

  #shade { position: absolute; inset: 0; background: #04071a; }
  #reflect { position: absolute; left: 370px; top: 1300px; width: 340px; height: 300px; border-radius: 60px;
    background: linear-gradient(180deg, rgba(160,190,240,.28), rgba(160,190,240,0)); filter: blur(10px); }
  #glowRim { position: absolute; left: 240px; top: 330px; width: 600px; height: 1060px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(60,130,255,.45), rgba(60,130,255,0) 62%); }

  /* scene 2 cards */
  .gcard { position: absolute; width: 250px; height: 330px; margin: -165px 0 0 -125px; border-radius: 38px;
    background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
    border: 2px solid rgba(255,255,255,.22); box-shadow: 0 30px 60px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; }

  /* swatches */
  .sw { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.35); }
  .sw .ring { position: absolute; inset: -12px; border-radius: 50%; border: 4px solid #B6F23C; box-shadow: 0 0 18px rgba(182,242,60,.7); opacity: 0; }

  /* panel */
  #panel { position: absolute; left: 160px; top: 1050px; width: 760px; height: 400px; border-radius: 56px;
    background: linear-gradient(160deg, rgba(240,244,255,.95), rgba(214,224,245,.92)); box-shadow: 0 40px 80px rgba(0,0,0,.45); }
  #panel .ph { position: absolute; border-radius: 14px; background: #c9d3e8; }
  #panel .seg { position: absolute; top: 300px; width: 112px; height: 22px; border-radius: 11px; background: #c9d3e8; }
  #panel .seg i { position: absolute; inset: 0; border-radius: 11px; background: linear-gradient(90deg, #9BE22A, #C8F55A); box-shadow: 0 0 14px rgba(182,242,60,.8); opacity: 0; }
  #btnC { position: absolute; left: 560px; top: 90px; width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6fa0ff, #2457e6 60%, #1a3fb0); box-shadow: 0 16px 30px rgba(36,87,230,.45), inset 0 2px 0 rgba(255,255,255,.45); }
  #btnC::after { content: ""; position: absolute; left: 50px; top: 50px; width: 50px; height: 50px; border-radius: 50%; border: 6px solid rgba(255,255,255,.9); }
  #trails { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

  #ringSvg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .pt { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #d8ff8a; box-shadow: 0 0 12px rgba(200,255,120,.9); }

  #ripple { position: absolute; width: 180px; height: 180px; margin: -90px 0 0 -90px; border-radius: 50%; border: 6px solid rgba(255,255,255,.85); opacity: 0; }
  #hand { position: absolute; left: 0; top: 0; width: 320px; height: 900px; transform-origin: 112px 12px; filter: drop-shadow(0 26px 30px rgba(0,0,0,.45)); }

  #disc { position: absolute; left: 50%; top: 1480px; transform: translateX(-50%); padding: 12px 26px; border-radius: 26px;
    background: rgba(255,255,255,.14); color: rgba(255,255,255,.85); font-size: 28px; font-weight: 800; white-space: nowrap; }

  #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; background: #111; color: #eee; display: flex; align-items: center; gap: 12px; padding: 0 16px; font: 14px system-ui, sans-serif; }
  #ui button, #ui select { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  #ui input[type=range] { flex: 1; }
  body.clean #ui { display: none; }
</style>
</head>

      <div class="ph" style="left:56px;top:70px;width:120px;height:120px;border-radius:34px;background:linear-gradient(140deg,#aab7d6,#8796bf)"></div>
      <div class="ph" style="left:200px;top:92px;width:290px;height:26px"></div>
      <div class="ph" style="left:200px;top:142px;width:200px;height:20px;background:#dbe2f1"></div>

      <div id="btnC"></div>
      <div class="seg" style="left:56px"><i></i></div><div class="seg" style="left:186px"><i></i></div><div class="seg" style="left:316px"><i></i></div><div class="seg" style="left:446px"><i></i></div>

<div id="ui">
  <button id="bPlay">Pause</button><button id="bRe">Restart</button>
  <input id="scrub" type="range" min="0" max="15" step="0.001" value="0"><span id="time">0.00</span>
  <select id="bgSel"><option value="scene">scene</option><option value="magenta">magenta</option><option value="green">green</option><option value="black">black</option><option value="checker">checker</option></select>
  <button id="bClean">Clean (H)</button>

<script>
(() => {
  const DUR = 15;
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), world = $('#world'), wrap = $('#wrap');
  const q = new URLSearchParams(location.search);

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eOut = p => 1 - Math.pow(1 - p, 3);
  const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const eOutBack = p => { const c = 1.4, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  const eInBack = p => { const c = 1.4; return (c + 1) * p * p * p - c * p * p; };
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, p) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], p))).join(',') + ')'; };

  // phone build: metal slices for a solid rounded edge
  const p3 = $('#p3'), D = 34, N = 14;
  for (let i = 0; i < N; i++) {
    const s = document.createElement('div'); s.className = 'slice';
    s.style.transform = `translateZ(${-D / 2 + D * (i + .5) / N}px)`;
    p3.insertBefore(s, p3.firstChild);
  }
  $('#backF').style.transform = `rotateY(180deg) translateZ(${D / 2 + .5}px)`;
  $('#frontF').style.transform = `translateZ(${D / 2 + .5}px)`;

  // finishes: silver, deep blue, natural titanium
  const FIN = [
    { f1: '#e3e7ec', f2: '#8d949d', fr: '#c3c8cf', fd: '#6d737c' },
    { f1: '#5d79a8', f2: '#1b2b4a', fr: '#7d8fae', fd: '#2c3a55' },
    { f1: '#d8c8b3', f2: '#8e7d68', fr: '#c4b6a3', fd: '#74685a' }
  ];
  ['#s0', '#s1', '#s2'].forEach((id, i) => $(id).style.background = `radial-gradient(circle at 35% 30%, ${FIN[i].f1}, ${FIN[i].f2})`);

  // phone keyframes: [t, x, y, z, ry, rx, rz, s]  (x,y = offset from centre 540,860)
  const K = [
    [0.0, 0, 40, -500, -95, 6, 0, .9],
    [2.0, 0, 0, 0, 155, -4, -6, 1.0],
    [2.6, 150, -20, -80, 165, -3, -4, .78],
    [4.4, 150, -20, -80, 200, -3, -2, .78],
    [5.0, 0, -10, 0, 180, 0, 0, .9],
    [5.9, 0, -10, 0, 180, 0, 0, .9],
    [6.9, 0, -10, 0, 360, 0, 0, .9],
    [7.0, 0, -10, 0, 360, 0, 0, .9],
    [7.6, 0, -300, -60, 360, 4, 0, .62],
    [9.5, 0, -300, -60, 362, 4, 0, .62],
    [10.4, 0, -20, 0, 525, -4, -5, 1.0],
    [12.5, 0, -30, 120, 535, -4, -5, 1.1],
    [15.0, 0, -40, 160, 548, -5, -6, 1.16]
  ];
  const phoneAt = t => {
    let i = 0; while (i < K.length - 2 && t >= K[i + 1][0]) i++;
    const a = K[i], b = K[i + 1], p = i === 0 ? eOut(seg(t, a[0], b[0])) : eInOut(seg(t, a[0], b[0]));
    return a.slice(1).map((v, j) => lerp(v, b[j + 1], p));
  };

  // particles
  const PTS = [];
  for (let i = 0; i < 16; i++) {
    const el = document.createElement('div'); el.className = 'pt'; $('#pts').appendChild(el);
    const a = (i / 16) * Math.PI * 2 + (i % 3) * .2;
    PTS.push({ el, a, r0: 440 + (i % 4) * 14, dr: 60 + (i * 37) % 90, d: (i * 0.071) % .5 });
  }

  const trails = [...document.querySelectorAll('.trl')];
  trails.forEach(p => { const L = p.getTotalLength(); p.dataset.l = L; p.style.strokeDasharray = L; });
  const ringL = 2 * Math.PI * 440;
  $('#ring').style.strokeDasharray = ringL;
  $('#pulse').style.strokeDasharray = `180 ${ringL}`;

  const el = id => document.getElementById(id);
  const cards = ['c0', 'c1', 'c2'].map(el), sws = ['s0', 's1', 's2'].map(el);
  const segs = [...document.querySelectorAll('#panel .seg i')];
  const BTN = { x: 160 + 560 + 75, y: 1050 + 90 + 75 };

  function render(t) {
    // camera: gentle push at start, slow push at the end
    const cam = lerp(.94, 1, eOut(seg(t, 0, 2))) * lerp(1, 1.05, eInOut(seg(t, 12.5, 15)));
    world.style.transform = `scale(${cam})`;
    $('#shade').style.opacity = 1 - eOut(seg(t, .15, 1.2));

    // beam sweep
    $('#beam').style.transform = `translateX(${lerp(-500, 1400, eInOut(seg(t, .3, 1.9)))}px) rotate(18deg)`;
    $('#beam').style.opacity = Math.sin(Math.PI * seg(t, .3, 1.9));

    // phone
    const [x, y, z, ry, rx, rz, s] = phoneAt(t);
    const bob = Math.sin(t * 1.4) * 6;
    p3.style.transform = `translate(${x}px, ${y + bob}px) translateZ(${z}px) rotateY(${ry}deg) rotateX(${rx}deg) rotateZ(${rz}deg) scale(${s})`;
    const sp = ((ry % 360) + 360) % 360;
    $('#sheenB').style.transform = `translateX(${lerp(-60, 60, (sp - 90) / 180) * 3}%)`;
    $('#sheenF').style.transform = `translateX(${lerp(60, -60, (sp + 90) % 360 / 180) * 3}%)`;
    $('#sheenF').style.opacity = .5;

    // finish change: silver -> deep blue at tap 5.35
    const fp = eInOut(seg(t, 5.4, 5.9));
    for (const k of ['f1', 'f2', 'fr', 'fd']) p3.style.setProperty('--' + k, mix(FIN[0][k], FIN[1][k], fp));

    // glow behind phone
    $('#glowRim').style.opacity = lerp(.5, 1, eInOut(seg(t, 12.3, 13.5))) * eOut(seg(t, .6, 2));
    $('#glowRim').style.transform = `translateY(${y}px)`;

    // scene 2 cards
    const cp = [[150, 560], [880, 700], [190, 1180]];
    cards.forEach((c, i) => {
      const inp = eOutBack(seg(t, 2.1 + i * .12, 2.7 + i * .12));
      const out = eInOut(seg(t, 4.15, 4.6));
      let X = cp[i][0], Y = cp[i][1], S = lerp(.7, i === 1 ? .82 : .92, inp), O = eOut(seg(t, 2.1 + i * .12, 2.5 + i * .12)), B = i === 1 ? 2 : 0;
      const sel = eInOut(seg(t, 3.25, 3.85));
      if (i === 0) { X = lerp(X, 300, sel); Y = lerp(Y, 760, sel); S *= lerp(1, 1.45, sel); }
      else { S *= lerp(1, .82, sel); O *= lerp(1, .45, sel); B += 4 * sel; }
      const fl = Math.sin(t * 1.5 + i * 2) * 8;
      c.style.left = X + 'px'; c.style.top = (Y + fl) + 'px';
      c.style.transform = `scale(${S * (1 - .2 * out)})`;
      c.style.opacity = O * (1 - out);
      c.style.filter = B ? `blur(${B}px)` : 'none';
      c.style.zIndex = i === 0 ? 3 : 1;
    });

    // swatches
    sws.forEach((w, i) => {
      const p = seg(t, 4.75 + i * .08, 5.15 + i * .08), out = eInOut(seg(t, 6.9, 7.3));
      const tap = i === 1 ? Math.sin(Math.PI * seg(t, 5.3, 5.5)) : 0;
      const big = i === 1 ? eOutBack(seg(t, 5.35, 5.75)) : 0;
      w.style.opacity = eOut(p) * (1 - out);
      w.style.transform = `translateY(${lerp(40, 0, eOutBack(p)) + 30 * out}px) scale(${(1 + .14 * big) * (1 - .1 * tap)})`;
      w.querySelector('.ring').style.opacity = i === 1 ? eOut(seg(t, 5.4, 5.7)) : 0;
    });

    // panel
    const pin = seg(t, 7.2, 7.7), pout = eInOut(seg(t, 9.4, 9.9));
    const press = Math.sin(Math.PI * seg(t, 7.98, 8.2));
    const panel = $('#panel');
    panel.style.opacity = eOut(pin) * (1 - pout);
    panel.style.transform = `translateY(${lerp(80, 0, eOutBack(pin))}px) scale(${(1 - .03 * press) * lerp(1, .9, pout)})`;
    $('#btnC').style.transform = `scale(${1 - .1 * press})`;
    segs.forEach((g, i) => { g.style.opacity = eOut(seg(t, 8.35 + i * .28, 8.55 + i * .28)); });

    // trails converge to the phone
    trails.forEach((p, i) => {
      const L = +p.dataset.l, a = 9.45 + i * .06;
      const draw = eInOut(seg(t, a, a + .6)), fade = eInOut(seg(t, a + .55, a + 1.0));
      p.style.strokeDashoffset = L * (1 - draw) - L * fade * .999;
      p.style.opacity = draw > 0 ? 1 - fade * .9 : 0;
    });

    // ring + pulse (no checkmark)
    const rd = eInOut(seg(t, 10.2, 11.0)), rout = eInOut(seg(t, 12.2, 12.9));
    $('#ring').style.strokeDashoffset = ringL * (1 - rd);
    $('#ringG').setAttribute('transform', `translate(540 ${860 + y}) scale(${lerp(.8, 1, eOut(rd)) * lerp(1, 1.08, rout)})`);
    $('#ring').style.opacity = 1 - rout;
    const pp = seg(t, 11.0, 12.3);
    $('#pulse').style.opacity = pp > 0 && pp < 1 ? Math.sin(Math.PI * pp) * (1 - rout) : 0;
    $('#pulse').setAttribute('transform', `rotate(${-90 + 360 * eInOut(pp)})`);
    PTS.forEach(o => {
      const p = seg(t, 10.9 + o.d, 12.4 + o.d), r = o.r0 + o.dr * eOut(p);
      o.el.style.left = (540 + Math.cos(o.a) * r) + 'px'; o.el.style.top = (860 + y + Math.sin(o.a) * r) + 'px';
      o.el.style.opacity = Math.sin(Math.PI * p) * .9;
    });

    // reflection + floor for the hero
    const hero = eInOut(seg(t, 12.4, 13.4));
    $('#reflect').style.opacity = hero * .9;
    $('#floor').style.opacity = lerp(.35, 1, hero);
    $('#floorLine').style.opacity = lerp(.2, 1, hero);

    // fingertip
    const hin = seg(t, 7.45, 7.95), hout = seg(t, 8.35, 8.9);
    let hx = lerp(1150, BTN.x, eOut(hin)), hy = lerp(1950, BTN.y, eOut(hin));
    if (hout > 0) { hx = lerp(BTN.x, 1180, eInBack(hout)); hy = lerp(BTN.y, 2100, eInBack(hout)); }
    const lift = Math.sin(Math.PI * seg(t, 7.8, 7.98));
    const hs = 1.3 * (1 - .07 * press);
    const hand = $('#hand');
    hand.style.transform = `translate(${hx - 112}px, ${hy - 12 - 20 * lift + Math.sin(t * 2.4) * 3}px) rotate(-12deg) scale(${hs})`;
    hand.style.opacity = t > 7.4 && t < 9 ? 1 : 0;

    // ripples: swatch tap + button tap
    const R = $('#ripple');
    let rr = null;
    if (t >= 5.35 && t < 5.85) rr = { x: 540, y: 1400, p: seg(t, 5.35, 5.85) };
    if (t >= 8.05 && t < 8.6) rr = { x: BTN.x, y: BTN.y, p: seg(t, 8.05, 8.6) };
    if (rr) { R.style.left = rr.x + 'px'; R.style.top = rr.y + 'px'; R.style.transform = `scale(${lerp(.3, 1.4, eOut(rr.p))})`; R.style.opacity = .9 * (1 - rr.p); }
    else R.style.opacity = 0;
  }

  // ---- layout / controls ----
  let S = 1;
  let T = clamp(+(q.get('t') || 0), 0, DUR), playing = !q.has('t'), loop = q.get('loop') !== '0', clean = q.get('clean') === '1';
  const setBg = v => { stage.className = 'bg-' + v + ((v === 'scene' || v === 'checker') ? '' : ' key'); document.body.style.background = clean ? ({ scene: '#04071a', magenta: '#FF00FF', green: '#00FF00', black: '#000', checker: '#ccc' }[v]) : '#05081a'; $('#bgSel').value = v; };
  const layout = () => {
    document.body.classList.toggle('clean', clean);
    const W = innerWidth, H = innerHeight - (clean ? 0 : 64);
    S = Math.min(W / 1080, H / 1920);
    stage.style.transform = `scale(${S})`;
    wrap.style.width = 1080 * S + 'px'; wrap.style.height = 1920 * S + 'px';
    wrap.style.left = (W - 1080 * S) / 2 + 'px'; wrap.style.top = (H - 1920 * S) / 2 + 'px';
    setBg($('#bgSel').value || 'scene');
    render(T);
  };
  $('#bgSel').value = q.get('bg') || 'scene';
  addEventListener('resize', layout);
  const ui = () => { $('#scrub').value = T; $('#time').textContent = T.toFixed(2); $('#bPlay').textContent = playing ? 'Pause' : 'Play'; };
  $('#bPlay').onclick = () => { playing = !playing; ui(); };
  $('#bRe').onclick = () => { T = 0; playing = true; ui(); render(T); };
  $('#scrub').oninput = e => { T = +e.target.value; playing = false; ui(); render(T); };
  $('#bgSel').onchange = e => { setBg(e.target.value); render(T); };
  $('#bClean').onclick = () => { clean = !clean; layout(); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { playing = !playing; ui(); e.preventDefault(); }
    if (e.key === 'r' || e.key === 'R') $('#bRe').onclick();
    if (e.key === 'h' || e.key === 'H') { clean = !clean; layout(); }
  });
  let last = null;
  const tick = now => {
    if (last != null && playing) {
      T += (now - last) / 1000;
      if (T >= DUR) { if (loop) T %= DUR; else { T = DUR; playing = false; } }
      render(T); ui();
    }
    last = now; requestAnimationFrame(tick);
  };
  layout(); ui();
  requestAnimationFrame(tick);

  let fontsOk = false;
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fontsOk = true; render(T); });
  window.__motion = { seek(t) { T = clamp(t, 0, DUR); playing = false; render(T); }, DUR, get ready() { return fontsOk; } };
})();
</script>
