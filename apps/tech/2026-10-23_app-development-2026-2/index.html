<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nookset">
<meta name="theme-color" content="#ffffff">
<title>Nookset AR room planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FF5A36'/%3E%3Crect x='12' y='27' width='40' height='15' rx='6' fill='%23fff'/%3E%3Crect x='17' y='18' width='30' height='13' rx='6' fill='%23fff' opacity='.85'/%3E%3Crect x='16' y='42' width='4' height='7' rx='2' fill='%23fff'/%3E%3Crect x='44' y='42' width='4' height='7' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="touchIcon" href="">
<style>
:root{
  --bg:#ffffff; --tile:#f3f2ef; --ink:#161616; --muted:#8a8780; --line:#ecebe7;
  --accent:#ff5a36; --accent2:#ff8a3d;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
img{-webkit-user-drag:none}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}

.badge{position:fixed;z-index:50;top:calc(var(--st) + 8px);left:50%;transform:translateX(-50%);
  font-size:11px;font-weight:600;letter-spacing:.2px;color:#fff;background:rgba(22,22,22,.45);
  padding:5px 11px;border-radius:999px;white-space:nowrap;pointer-events:none;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

.screen{position:absolute;inset:0;background:var(--bg);transition:transform .45s cubic-bezier(.2,.85,.25,1),opacity .35s;will-change:transform}
#s-home{transform:none}
#s-home.away{transform:scale(.94);opacity:0;pointer-events:none}
#s-ar{transform:translateY(100%)}
#s-ar.on{transform:none}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:calc(var(--st) + 42px) 20px calc(var(--sb) + 28px)}
.scroll::-webkit-scrollbar{display:none}

/* home */
.head{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;border-radius:13px;background:var(--accent);display:grid;place-items:center}
.brand{font-size:20px;font-weight:700;letter-spacing:-.3px}
.beta{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);background:var(--tile);padding:7px 12px;border-radius:999px}
.title{font-size:32px;line-height:1.08;letter-spacing:-.9px;margin:22px 0 18px;font-weight:300}
.title b{font-weight:800;display:block}
.title i{font-style:normal;color:var(--accent)}
.hero{position:relative;display:block;width:100%;height:172px;border-radius:30px;overflow:hidden;text-align:left;
  background:radial-gradient(120% 140% at 100% 0%,#ffb067 0%,#ff7a3d 38%,#ff4d2e 100%);color:#fff;padding:22px;transition:transform .15s}
.hero:active,.card:active,.chip:active{transform:scale(.97)}
.hero h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.05;max-width:52%}
.hero p{margin:8px 0 0;font-size:13px;opacity:.9;max-width:48%;line-height:1.3}
.hero .ring{position:absolute;right:-10px;bottom:-4px;width:220px;height:62px;border-radius:50%;border:10px solid rgba(255,255,255,.28)}
.hero img{position:absolute;right:-6px;bottom:2px;width:190px;height:190px;object-fit:contain;filter:drop-shadow(0 14px 16px rgba(120,30,0,.35))}
.hero .cube{position:absolute;left:22px;bottom:20px;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center}
.chips{display:flex;gap:8px;margin:22px -20px 16px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:42px;padding:0 16px;border-radius:999px;background:var(--tile);font-size:15px;font-weight:600;transition:background .2s,color .2s,transform .15s}
.chip svg{width:18px;height:18px}
.chip.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{text-align:left;transition:transform .15s,opacity .25s}
.card .ph{position:relative;height:168px;border-radius:26px;background:var(--tile);overflow:hidden}
.card img{display:block;width:100%;height:100%;object-fit:contain;padding:8px}
.card .ar{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.card b{display:block;font-size:15px;font-weight:600;margin:10px 4px 0;letter-spacing:-.2px}
.card.hide{display:none}

/* AR */
#s-ar{background:#111}
#cam,#gl{position:absolute;inset:0;width:100%;height:100%}
#cam{object-fit:cover;background:#111}
#gl{touch-action:none}
.glass{background:rgba(22,22,22,.42);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);color:#fff}
.ar-top{position:absolute;left:0;right:0;top:calc(var(--st) + 38px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;pointer-events:none}
.ar-top>*{pointer-events:auto}
.circ{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.ar-title{font-size:17px;font-weight:600;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.hint{position:absolute;left:50%;top:calc(var(--st) + 100px);transform:translateX(-50%);font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;white-space:nowrap;transition:opacity .3s,transform .3s;display:flex;align-items:center;gap:8px}
.hint.off{opacity:0;transform:translate(-50%,-6px)}
.hint .spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dim{position:absolute;left:0;top:0;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;transform:translate(-50%,-100%);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.dim.on{opacity:1}
.swatches{position:absolute;left:50%;bottom:calc(var(--sb) + 150px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:999px;transition:opacity .25s,transform .25s}
.swatches.off{opacity:0;transform:translate(-50%,10px);pointer-events:none}
.sw{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .15s}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.sw:active{transform:scale(.88)}
.icn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16)}
.okb{height:34px;padding:0 16px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
.sheet{position:absolute;left:-6%;right:-6%;bottom:0;height:calc(var(--sb) + 132px);background:#fff;border-radius:50% 50% 0 0 / 56px 56px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:#dcdad5;margin:10px auto 0}
.car{display:flex;align-items:center;gap:12px;overflow-x:auto;scrollbar-width:none;padding:10px calc(6% + 20px) 0;height:104px}
.car::-webkit-scrollbar{display:none}
.it{flex:none;width:62px;height:62px;border-radius:50%;background:var(--tile);display:grid;place-items:center;transition:width .25s,height .25s,box-shadow .25s}
.it img{width:86%;height:86%;object-fit:contain}
.it.on{width:78px;height:78px;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent)}
</style>
</head>
<body>
<div id="app">
  <div class="badge">For illustration purposes only</div>

  <!-- 1. Home -->
  <section id="s-home" class="screen">
    <div class="scroll">
      <div class="head">
        <div class="mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V9a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v2"/><path d="M3 17v-4a2 2 0 0 1 4 0v1h10v-1a2 2 0 0 1 4 0v4H3z"/><path d="M5 17v2M19 17v2"/></svg></div>
        <div class="brand lp">Nookset</div>
        <div class="beta">Beta</div>
      </div>
      <div class="title">Try furniture<b>in your room<i>.</i></b></div>
      <button class="hero" id="hero">
        <h2>See it in AR</h2>
        <p>Point your camera at the floor</p>
        <span class="ring"></span><img id="heroImg" alt="">
        <span class="cube"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff5a36" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg></span>
      </button>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- 2. AR -->
  <section id="s-ar" class="screen">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="gl"></canvas>
    <div class="ar-top">
      <button class="circ" id="arBack" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ar-title lp">Your room</div>
      <button class="circ" id="modeBtn" aria-label="View"><svg id="modeIco" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
    </div>
    <div id="hint" class="hint glass off"></div>
    <div id="dim" class="dim glass"></div>
    <div id="swatches" class="swatches glass off"></div>
    <div class="sheet"><div class="grab"></div><div class="car" id="car"></div></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const rad = d => d * Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const params = new URLSearchParams(location.search);

/* ---------- home-screen icon (iOS needs PNG) ---------- */
(function makeIcon() {
  const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
  x.fillStyle = '#ff5a36'; x.fillRect(0, 0, 180, 180);
  const rr = (X, Y, W, H, R) => { x.beginPath(); x.roundRect ? x.roundRect(X, Y, W, H, R) : x.rect(X, Y, W, H); x.fill(); };
  x.fillStyle = 'rgba(255,255,255,.85)'; rr(48, 52, 84, 34, 16);
  x.fillStyle = '#fff'; rr(32, 76, 116, 44, 18); rr(44, 118, 10, 18, 5); rr(126, 118, 10, 18, 5);
  $('#touchIcon').href = c.toDataURL('image/png');
})();

if (!window.THREE) { document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;bottom:40px;left:0;right:0;text-align:center;color:#8a8780">Connect to the internet and reload</p>'); return; }

/* ---------- 3D helpers ---------- */
const col = h => new THREE.Color(h).convertSRGBToLinear();
const Mat = {
  fabric: c => new THREE.MeshStandardMaterial({ color: col(c), roughness: .92, metalness: 0 }),
  wood: c => new THREE.MeshStandardMaterial({ color: col(c), roughness: .55, metalness: 0 }),
  metal: c => new THREE.MeshStandardMaterial({ color: col(c), roughness: .3, metalness: .75 }),
  matte: c => new THREE.MeshStandardMaterial({ color: col(c), roughness: .7, metalness: 0 }),
};
function shadowed(m, cast = true) { m.castShadow = cast; m.receiveShadow = true; return m; }
function rbox(w, h, d, r, mat) {
  r = Math.min(r, w / 2 * .98, h / 2 * .98, d / 2 * .98);
  const b = r * .6, cr = Math.max(.001, r - b), sw = w - 2 * b, sh = h - 2 * b, x = -sw / 2, y = -sh / 2;
  const q = Math.min(cr, sw / 2, sh / 2), s = new THREE.Shape();
  s.moveTo(x + q, y); s.lineTo(x + sw - q, y); s.quadraticCurveTo(x + sw, y, x + sw, y + q);
  s.lineTo(x + sw, y + sh - q); s.quadraticCurveTo(x + sw, y + sh, x + sw - q, y + sh);
  s.lineTo(x + q, y + sh); s.quadraticCurveTo(x, y + sh, x, y + sh - q);
  s.lineTo(x, y + q); s.quadraticCurveTo(x, y, x + q, y);
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(.001, d - 2 * b), bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 5, curveSegments: 10 });
  g.center();
  return shadowed(new THREE.Mesh(g, mat));
}
function cyl(rt, rb, h, mat, seg = 24, open = false) { return shadowed(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), mat)); }
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
}

/* ---------- furniture builders ---------- */
function armchair(o) {
  // mid-century armchair: angled tapered legs, curved arms, reclined back
  const g = new THREE.Group(), fab = Mat.fabric(o.color), lm = Mat.matte('#1c1c1c');
  const legH = .3, seatY = legH + .07;
  const base = rbox(.74, .14, .72, .05, fab); base.position.y = seatY; g.add(base);
  const cush = rbox(.6, .13, .6, .055, fab); cush.position.set(0, seatY + .12, .05); g.add(cush);
  const back = rbox(.74, .58, .15, .07, fab); back.position.set(0, seatY + .36, -.31); back.rotation.x = -.2; g.add(back);
  [-1, 1].forEach(sx => {
    const a = rbox(.12, .3, .7, .06, fab); a.position.set(sx * .37, seatY + .17, 0); a.rotation.z = sx * -.06; g.add(a);
    const top = rbox(.15, .06, .62, .03, fab); top.position.set(sx * .385, seatY + .33, .02); g.add(top);
  });
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
    const l = cyl(.012, .02, legH + .04, lm, 12); l.position.set(sx * .3, legH / 2, sz * .27);
    l.rotation.z = sx * .16; l.rotation.x = sz * -.14; g.add(l);
  });
  return g;
}
function sofa(o) {
  const { w = 2.1, D = .9, seats = 3, legH = .12, armW = .18, armH = .62, back = .44, color, leg = '#3b2a1f', r = .07 } = o;
  const g = new THREE.Group(), fab = Mat.fabric(color), lm = Mat.wood(leg), baseH = .2;
  const base = rbox(w, baseH, D, .05, fab); base.position.y = legH + baseH / 2; g.add(base);
  [-1, 1].forEach(sx => { const a = rbox(armW, armH - legH, D, r, fab); a.position.set(sx * (w / 2 - armW / 2), legH + (armH - legH) / 2, 0); g.add(a); });
  const inner = w - 2 * armW, cw = inner / seats;
  const bf = rbox(inner, back * .92, .12, .03, fab); bf.position.set(0, legH + baseH + back * .46 - .02, -D / 2 + .06); g.add(bf);
  for (let i = 0; i < seats; i++) {
    const cx = -inner / 2 + cw * (i + .5);
    const c = rbox(cw - .012, .16, D - .24, .065, fab); c.position.set(cx, legH + baseH + .07, .1); g.add(c);
    const bk = rbox(cw - .02, back, .2, .09, fab); bk.position.set(cx, legH + baseH + back / 2 + .02, -D / 2 + .19); bk.rotation.x = -.15; g.add(bk);
  }
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => { const l = cyl(.022, .015, legH, lm, 12); l.position.set(sx * (w / 2 - .07), legH / 2, sz * (D / 2 - .07)); g.add(l); });
  return g;
}
function floorLamp(o) {
  const g = new THREE.Group(), metal = Mat.metal('#c9a46a');
  const shade = new THREE.MeshStandardMaterial({ color: col(o.color), roughness: .85, side: THREE.DoubleSide, emissive: col('#ffcf8f'), emissiveIntensity: .3 });
  const base = cyl(.16, .17, .03, Mat.matte('#1c1c1c'), 40); base.position.y = .015; g.add(base);
  const pole = cyl(.011, .011, 1.4, metal, 12); pole.position.y = .73; g.add(pole);
  const sh = cyl(.14, .24, .3, shade, 48, true); sh.position.y = 1.5; g.add(sh);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(.05, 16, 12), new THREE.MeshBasicMaterial({ color: col('#fff4dc') })); bulb.position.y = 1.43; g.add(bulb);
  const pl = new THREE.PointLight(0xffd9a0, .55, 3.2); pl.position.y = 1.4; g.add(pl);
  return g;
}
function globeLamp(o) {
  const g = new THREE.Group(), metal = Mat.metal('#c9a46a');
  const base = cyl(.15, .16, .025, metal, 40); base.position.y = .0125; g.add(base);
  const pole = cyl(.01, .01, 1.25, metal, 12); pole.position.y = .64; g.add(pole);
  const glob = shadowed(new THREE.Mesh(new THREE.SphereGeometry(.2, 40, 28), new THREE.MeshStandardMaterial({ color: col(o.color), roughness: .35, emissive: col('#fff0d2'), emissiveIntensity: .7 })));
  glob.position.y = 1.45; g.add(glob);
  const pl = new THREE.PointLight(0xffe2b0, .5, 3); pl.position.y = 1.45; g.add(pl);
  return g;
}
function rugRound(o) {
  const [a, b, c] = o.pal;
  const tex = canvasTex(1024, 1024, (x, W) => {
    x.fillStyle = a; x.fillRect(0, 0, W, W); const r0 = W / 2;
    [[.95, b, 22], [.8, c, 10], [.58, b, 34], [.4, c, 10], [.2, b, 70]].forEach(([r, s, lw]) => { x.beginPath(); x.arc(r0, r0, r0 * r - lw / 2, 0, Math.PI * 2); x.lineWidth = lw; x.strokeStyle = s; x.stroke(); });
    for (let n = 0; n < 12000; n++) { x.fillStyle = `rgba(0,0,0,${Math.random() * .05})`; x.fillRect(Math.random() * W, Math.random() * W, 2, 2); }
  });
  const m = new THREE.Mesh(new THREE.CylinderGeometry(.8, .8, .012, 72), new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }));
  m.position.y = .006; m.receiveShadow = true; const g = new THREE.Group(); g.add(m); g.userData.flat = true; return g;
}
function coffeeTable(o) {
  const g = new THREE.Group(), wd = Mat.wood(o.color);
  const top = cyl(.45, .45, .04, wd, 64); top.position.y = .4; g.add(top);
  const shelf = cyl(.32, .32, .025, wd, 48); shelf.position.y = .14; g.add(shelf);
  for (let i = 0; i < 3; i++) { const a = i * Math.PI * 2 / 3, l = cyl(.022, .016, .38, wd, 12); l.position.set(Math.cos(a) * .3, .19, Math.sin(a) * .3); g.add(l); }
  return g;
}
function figTree(o) {
  const g = new THREE.Group(), pot = Mat.matte(o.color);
  const p = cyl(.2, .15, .36, pot, 40); p.position.y = .18; g.add(p);
  const soil = cyl(.185, .185, .02, Mat.matte('#4a3626'), 32); soil.position.y = .35; g.add(soil);
  const trunk = cyl(.022, .03, 1.05, Mat.wood('#6b4f37'), 10); trunk.position.y = .36 + .52; g.add(trunk);
  const greens = ['#3f8a4a', '#4f9d55', '#367a3f', '#62ad5c'];
  const pts = [[0, 1.62, 0, .26], [.2, 1.45, .08, .22], [-.2, 1.4, -.05, .23], [.05, 1.3, .22, .2], [-.08, 1.25, -.22, .2], [.22, 1.2, -.15, .18], [-.22, 1.15, .14, .18], [0, 1.05, 0, .16]];
  pts.forEach(([x, y, z, r], i) => { const m = shadowed(new THREE.Mesh(new THREE.IcosahedronGeometry(r, 3), new THREE.MeshStandardMaterial({ color: col(greens[i % 4]), roughness: .8 }))); m.position.set(x, y, z); g.add(m); });
  return g;
}

const C = { mustard: ['Mustard', '#e8ad26'], sky: ['Sky', '#86a9d8'], teal: ['Teal', '#2f6b66'], blush: ['Blush', '#eab7ab'], coral: ['Coral', '#ef6a4b'], cream: ['Cream', '#ece4d6'] };
const CATS = [

  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') listenOri(); }).catch(() => {});
  } else listenOri();
}

/* loop */
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
function startScan() {
  scanned = false; scanT0 = performance.now(); hint('Point at the floor', true);
  const c = centerFloor() || new THREE.Vector3(0, 0, -1.7), a = scanGeo.attributes.position.array;
  for (let i = 0; i < SCAN_N; i++) { const r = Math.sqrt(Math.random()) * 2.2, t = Math.random() * Math.PI * 2; a[i * 3] = c.x + Math.cos(t) * r; a[i * 3 + 1] = .004; a[i * 3 + 2] = c.z + Math.sin(t) * r * 1.3; }
  scanGeo.attributes.position.needsUpdate = true; scanGeo.setDrawRange(0, 0); scanMat.opacity = .9; scanPts.visible = true;
}
function enterAR() {
  arOn = true; yawFix = null; resize(); camera.quaternion.copy(staticQ);
  if (!stream && mode === 'camera' && !room.visible) startCamera();
  requestAnimationFrame(() => { updateCamera(1); if (!scanned) startScan(); else if (pending) hint('Tap to place'); else hint(null); });
  requestAnimationFrame(loop);
}
function leaveAR() { arOn = false; hint(null); }
function updateCamera(k) {
  if (devQ) {
    if (yawFix === null) { const f = new THREE.Vector3(0, 0, -1).applyQuaternion(devQ); fixQ.setFromAxisAngle(new THREE.Vector3(0, 1, 0), -Math.atan2(-f.x, -f.z)); yawFix = true; }
    tgtQ.copy(fixQ).multiply(devQ); camera.quaternion.slerp(tgtQ, k);
  } else camera.quaternion.slerp(staticQ, k);
}
const dimEl = $('#dim');
function loop(now) {
  if (!arOn) return;
  requestAnimationFrame(loop);
  updateCamera(.35);
  if (!scanned) {
    const k = (now - scanT0) / 1900;
    scanGeo.setDrawRange(0, Math.floor(clamp(k, 0, 1) * SCAN_N));
    if (k >= 1) { scanned = true; hint(pending ? 'Tap to place' : null); }
  } else if (scanPts.visible) { scanMat.opacity -= .03; if (scanMat.opacity <= 0) scanPts.visible = false; }
  const c = scanned && pending ? centerFloor() : null;
  reticle.visible = !!c;
  if (c) { reticle.position.set(c.x, .012, c.z); const s = 1 + Math.sin(now / 260) * .06; ringB.scale.set(s, s, s); }
  placed.forEach(o => {
    const ud = o.userData;
    if (ud.anim) { const k = clamp((now - ud.anim) / 480, 0, 1); ud.model.position.y = (1 - easeOutCubic(k)) * .32; ud.model.scale.setScalar(.86 + .14 * easeOutBack(k)); if (ud.blob) ud.blob.material.opacity = .5 * k; if (k >= 1) ud.anim = 0; }
    if (ud.pop) { const k = clamp((now - ud.pop) / 260, 0, 1); ud.model.scale.setScalar(.94 + .06 * easeOutBack(k)); if (ud.blob) ud.blob.material.opacity = .5; if (k >= 1) ud.pop = 0; }
  });
  if (selected && now < dimUntil) {
    tmpV.copy(selected.position); tmpV.y += selected.userData.h + .12; tmpV.project(camera);
    dimEl.textContent = selected.userData.item.dim;
    dimEl.style.left = ((tmpV.x + 1) / 2 * innerWidth) + 'px'; dimEl.style.top = ((1 - tmpV.y) / 2 * innerHeight) + 'px';
    dimEl.classList.toggle('on', tmpV.z < 1);
  } else dimEl.classList.remove('on');
  renderer.render(scene, camera);
}
setMode(params.get('room') === '1' ? 'room' : 'camera');
renderCar();
})();
