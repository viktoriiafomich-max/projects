<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nookset">
<meta name="theme-color" content="#f6f2ec">
<title>Nookset AR room planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff8a4c'/%3E%3Cstop offset='1' stop-color='%23ff4f6d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Crect x='12' y='26' width='40' height='16' rx='5' fill='%23fff'/%3E%3Crect x='17' y='18' width='30' height='12' rx='5' fill='%23fff' opacity='.85'/%3E%3Crect x='16' y='42' width='4' height='6' rx='2' fill='%23fff'/%3E%3Crect x='44' y='42' width='4' height='6' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="touchIcon" href="">
<style>
:root{
  --bg:#f6f2ec; --card:#fff; --ink:#1e1c1a; --muted:#7d766d; --line:#e7e0d6;
  --accent:#ff6a3d; --accent2:#ff4f6d; --soft:#efe8de;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}

.badge{position:fixed;z-index:50;top:calc(var(--st) + 8px);left:50%;transform:translateX(-50%);
  font-size:11px;font-weight:600;letter-spacing:.2px;color:#fff;background:rgba(20,18,16,.55);
  padding:5px 11px;border-radius:999px;white-space:nowrap;pointer-events:none;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

.screen{position:absolute;inset:0;transform:translateX(100%);transition:transform .42s cubic-bezier(.2,.85,.25,1),opacity .42s;will-change:transform;background:var(--bg)}
.screen.on{transform:none}
.screen.left{transform:translateX(-26%);opacity:.6}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:calc(var(--st) + 44px) 18px calc(var(--sb) + 28px)}
.scroll::-webkit-scrollbar{display:none}

/* home */
.head{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
.appicon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 6px 14px rgba(255,90,70,.3)}
.brand{font-size:23px;font-weight:800;letter-spacing:-.4px}
.chip{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);background:#ffe9e0;padding:5px 10px;border-radius:999px}
.hero{position:relative;background:#1f1d1b;color:#fff;border-radius:26px;padding:20px 18px;min-height:178px;overflow:hidden;box-shadow:0 14px 30px rgba(30,20,10,.18)}
.hero h1{font-size:25px;line-height:1.08;margin:12px 0 8px;font-weight:800;letter-spacing:-.5px;max-width:58%}
.hero p{font-size:13.5px;line-height:1.35;margin:0;color:#cfc8bf;max-width:56%}
.arpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);padding:5px 10px;border-radius:999px}
.hero .floor{position:absolute;right:-30px;bottom:18px;width:230px;height:70px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.22)}
.hero img{position:absolute;right:-14px;bottom:4px;width:200px;height:200px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.h2{font-size:19px;font-weight:800;letter-spacing:-.3px;margin:24px 2px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:22px;padding:10px 12px 14px;text-align:left;box-shadow:0 2px 0 var(--line);transition:transform .15s}
.tile:active,.card:active,.titem:active{transform:scale(.96)}
.tile .ph{height:104px;border-radius:16px;background:var(--soft);overflow:hidden}
.tile img{display:block;width:100%;height:100%;object-fit:contain}
.tile b{display:block;font-size:16px;margin-top:10px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.sel{box-shadow:0 0 0 2.5px var(--accent)}

/* catalog */
.bar{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.round{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 0 var(--line)}
.bar h2{font-size:26px;margin:0;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:14px;margin:6px 2px 16px}
.card{display:block;width:100%;background:var(--card);border-radius:24px;padding:12px;margin-bottom:14px;text-align:left;box-shadow:0 2px 0 var(--line);transition:transform .15s}
.card .ph{height:210px;border-radius:18px;background:radial-gradient(120% 80% at 50% 90%,#e6ddd0 0,#f3eee7 60%);overflow:hidden}
.card img{display:block;width:100%;height:100%;object-fit:contain}
.card .row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 2px}
.card b{font-size:17px}
.card small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.dots{display:flex;gap:5px}
.dots i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.go{width:40px;height:40px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}

/* AR */
#s-ar{background:#111}
#cam,#gl{position:absolute;inset:0;width:100%;height:100%}
#cam{object-fit:cover;background:#111}
#gl{touch-action:none}
.glass{background:rgba(22,20,18,.48);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);color:#fff}
.ar-top{position:absolute;left:0;right:0;top:calc(var(--st) + 38px);display:flex;align-items:center;justify-content:space-between;padding:0 14px;pointer-events:none}
.ar-top>*{pointer-events:auto}
.ar-top .round{background:rgba(22,20,18,.48);box-shadow:none;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ar-title{font-weight:800;font-size:16px;padding:10px 16px;border-radius:999px}
.hint{position:absolute;left:50%;top:calc(var(--st) + 96px);transform:translateX(-50%);font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;white-space:nowrap;transition:opacity .3s,transform .3s;display:flex;align-items:center;gap:8px}
.hint.off{opacity:0;transform:translate(-50%,-6px)}
.hint .spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dim{position:absolute;left:0;top:0;font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;transform:translate(-50%,-100%);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.dim.on{opacity:1}
.ar-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(var(--sb) + 14px)}
.chips{display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:12px;transition:opacity .25s,transform .25s}
.chips.off{opacity:0;transform:translateY(8px);pointer-events:none}
.sw{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.55);transition:transform .15s}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--accent)}
.sw:active{transform:scale(.88)}
.trash{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;margin-left:6px}
.tray-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:26px}
.tray{display:flex;gap:8px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
.tray::-webkit-scrollbar{display:none}
.titem{flex:none;width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.92);display:grid;place-items:center;transition:transform .15s,box-shadow .15s}
.titem img{width:56px;height:56px;object-fit:contain}
.titem.on{box-shadow:0 0 0 3px var(--accent)}
.okbtn{flex:none;height:64px;min-width:64px;padding:0 18px;border-radius:20px;background:var(--accent);color:#fff;font-weight:800;font-size:17px}
.okbtn:active{transform:scale(.95)}
.ph-empty{width:60%;height:60%;border-radius:14px;background:linear-gradient(90deg,#ece5da,#f6f1ea,#ece5da);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div id="app">
  <div class="badge">For illustration purposes only</div>

  <!-- 1. Home -->
  <section id="s-home" class="screen on">
    <div class="scroll">
      <div class="head">
        <div class="appicon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V9a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v2"/><path d="M3 17v-4a2 2 0 0 1 4 0v1h10v-1a2 2 0 0 1 4 0v4H3z"/><path d="M5 17v2M19 17v2"/></svg></div>
        <div class="brand lp">Nookset</div>
        <div class="chip">Beta</div>
      </div>
      <div class="hero">
        <span class="arpill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg>AR view</span>
        <h1>See furniture in your room</h1>
        <p>Place 3D sofas, lamps and rugs in your room with your phone camera.</p>
        <div class="floor"></div>
        <img id="heroImg" alt="">
      </div>
      <div class="h2">What do you want to try in your room?</div>
      <div class="grid" id="cats"></div>
    </div>
  </section>

  <!-- 2. Catalog -->
  <section id="s-cat" class="screen">
    <div class="scroll">
      <div class="bar">
        <button class="round" id="catBack" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h2 id="catTitle" class="lp">Sofas</h2>
      </div>
      <div class="sub">Pick a model to see it in your room</div>
      <div id="items"></div>
    </div>
  </section>

  <!-- 3. AR -->
  <section id="s-ar" class="screen">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="gl"></canvas>
    <div class="ar-top">
      <button class="round" id="arBack" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ar-title glass lp">Nookset</div>
      <button class="round" id="modeBtn" aria-label="View"><svg id="modeIco" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
    </div>
    <div id="hint" class="hint glass off"></div>
    <div id="dim" class="dim glass"></div>
    <div class="ar-bottom">
      <div id="chips" class="chips off"></div>
      <div class="tray-row glass">
        <div id="tray" class="tray"></div>
        <button id="okBtn" class="okbtn">OK</button>
      </div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const rad = d => d * Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const params = new URLSearchParams(location.search);

/* ---------- home-screen icon (iOS needs PNG) ---------- */
(function makeIcon() {
  const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, '#ff8a4c'); g.addColorStop(1, '#ff4f6d');
  x.fillStyle = g; x.fillRect(0, 0, 180, 180);
  const rr = (X, Y, W, H, R) => { x.beginPath(); x.roundRect ? x.roundRect(X, Y, W, H, R) : x.rect(X, Y, W, H); x.fill(); };
  x.fillStyle = 'rgba(255,255,255,.85)'; rr(48, 52, 84, 34, 14);
  x.fillStyle = '#fff'; rr(32, 76, 116, 44, 16); rr(44, 118, 10, 16, 4); rr(126, 118, 10, 16, 4);
  $('#touchIcon').href = c.toDataURL('image/png');
})();

if (!window.THREE) { document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;bottom:40px;left:0;right:0;text-align:center;color:#7d766d">Connect to the internet and reload</p>'); return; }

/* ---------- 3D helpers ---------- */
const col = h => new THREE.Color(h).convertSRGBToLinear();
const Mat = {
  fabric: c => new THREE.MeshStandardMaterial({ color: col(c), roughness: .93, metalness: 0 }),
  wood: c => new THREE.MeshStandardMaterial({ color: col(c), roughness: .55, metalness: 0 }),
  metal: c => new THREE.MeshStandardMaterial({ color: col(c), roughness: .32, metalness: .75 }),
  matte: c => new THREE.MeshStandardMaterial({ color: col(c), roughness: .7, metalness: 0 }),
};
function shadowed(m, cast = true) { m.castShadow = cast; m.receiveShadow = true; return m; }
function rbox(w, h, d, r, mat) {
  r = Math.min(r, w / 2 * .98, h / 2 * .98, d / 2 * .98);
  const b = r * .6, cr = Math.max(.001, r - b), sw = w - 2 * b, sh = h - 2 * b, x = -sw / 2, y = -sh / 2;
  const q = Math.min(cr, sw / 2, sh / 2), s = new THREE.Shape();
  s.moveTo(x + q, y); s.lineTo(x + sw - q, y); s.quadraticCurveTo(x + sw, y, x + sw, y + q);
  s.lineTo(x + sw, y + sh - q); s.quadraticCurveTo(x + sw, y + sh, x + sw - q, y + sh);
  s.lineTo(x + q, y + sh); s.quadraticCurveTo(x, y + sh, x, y + sh - q);
  s.lineTo(x, y + q); s.quadraticCurveTo(x, y, x + q, y);
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(.001, d - 2 * b), bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 4, curveSegments: 8 });
  g.center();
  return shadowed(new THREE.Mesh(g, mat));
}
function cyl(rt, rb, h, mat, seg = 24, open = false) { return shadowed(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), mat)); }
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
}

/* ---------- furniture builders ---------- */
function sofa(o) {
  const { w = 2.1, D = .9, seats = 3, legH = .12, armW = .18, armH = .62, back = .44, color, leg = '#3b2a1f' } = o;
  const g = new THREE.Group(), fab = Mat.fabric(color), lm = Mat.wood(leg), baseH = .2;
  const base = rbox(w, baseH, D, .045, fab); base.position.y = legH + baseH / 2; g.add(base);
  [-1, 1].forEach(sx => { const a = rbox(armW, armH - legH, D, .07, fab); a.position.set(sx * (w / 2 - armW / 2), legH + (armH - legH) / 2, 0); g.add(a); });
  const inner = w - 2 * armW, cw = inner / seats;
  const bf = rbox(inner, back * .92, .12, .03, fab); bf.position.set(0, legH + baseH + back * .46 - .02, -D / 2 + .06); g.add(bf);
  for (let i = 0; i < seats; i++) {
    const cx = -inner / 2 + cw * (i + .5);
    const c = rbox(cw - .012, .16, D - .24, .06, fab); c.position.set(cx, legH + baseH + .07, .1); g.add(c);
    const bk = rbox(cw - .02, back, .2, .085, fab); bk.position.set(cx, legH + baseH + back / 2 + .02, -D / 2 + .19); bk.rotation.x = -.15; g.add(bk);
  }
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => { const l = cyl(.022, .015, legH, lm, 12); l.position.set(sx * (w / 2 - .07), legH / 2, sz * (D / 2 - .07)); g.add(l); });
  return g;
}
function floorLamp(o) {
  const g = new THREE.Group(), metal = Mat.metal('#2b2a29');
  const shade = new THREE.MeshStandardMaterial({ color: col(o.color), roughness: .9, side: THREE.DoubleSide, emissive: col('#ffcf8f'), emissiveIntensity: .35 });
  const base = cyl(.17, .18, .03, metal, 40); base.position.y = .015; g.add(base);
  const pole = cyl(.012, .012, 1.4, metal, 12); pole.position.y = .73; g.add(pole);
  const sh = cyl(.15, .23, .32, shade, 48, true); sh.position.y = 1.5; g.add(sh);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(.05, 16, 12), new THREE.MeshBasicMaterial({ color: col('#fff4dc') })); bulb.position.y = 1.43; g.add(bulb);
  const pl = new THREE.PointLight(0xffd9a0, .55, 3.2); pl.position.y = 1.4; g.add(pl);
  return g;
}
function globeLamp(o) {
  const g = new THREE.Group(), metal = Mat.metal(o.metal || '#b8925a');
  const base = cyl(.15, .16, .025, metal, 40); base.position.y = .0125; g.add(base);
  const pole = cyl(.01, .01, 1.25, metal, 12); pole.position.y = .64; g.add(pole);
  const glob = shadowed(new THREE.Mesh(new THREE.SphereGeometry(.2, 40, 28), new THREE.MeshStandardMaterial({ color: col(o.color), roughness: .35, emissive: col('#fff0d2'), emissiveIntensity: .75 })));
  glob.position.y = 1.45; g.add(glob);
  const pl = new THREE.PointLight(0xffe2b0, .5, 3); pl.position.y = 1.45; g.add(pl);
  return g;
}
function rugRect(o) {
  const [a, b, c] = o.pal;
  const tex = canvasTex(1024, 720, (x, W, H) => {
    x.fillStyle = a; x.fillRect(0, 0, W, H);
    x.strokeStyle = b; x.lineWidth = 26; x.strokeRect(40, 40, W - 80, H - 80);
    x.lineWidth = 8; x.strokeRect(90, 90, W - 180, H - 180);
    x.fillStyle = c;
    for (let i = 0; i < 9; i++) { const y = 140 + i * 52; x.beginPath(); for (let k = 0; k <= 16; k++) { const px = 140 + k * ((W - 280) / 16); x.lineTo(px, y + (k % 2 ? 18 : -18)); } x.lineWidth = 10; x.strokeStyle = i % 2 ? c : b; x.stroke(); }
    for (let n = 0; n < 9000; n++) { x.fillStyle = `rgba(0,0,0,${Math.random() * .05})`; x.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
  });
  const m = new THREE.Mesh(new THREE.BoxGeometry(2, .012, 1.4), new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }));
  m.position.y = .006; m.receiveShadow = true; const g = new THREE.Group(); g.add(m); g.userData.flat = true; return g;
}
function rugRound(o) {
  const [a, b, c] = o.pal;
  const tex = canvasTex(1024, 1024, (x, W) => {
    x.fillStyle = a; x.fillRect(0, 0, W, W); const r0 = W / 2;
    [[.96, b, 18], [.86, c, 8], [.62, b, 30], [.44, c, 8], [.22, b, 60]].forEach(([r, s, lw]) => { x.beginPath(); x.arc(r0, r0, r0 * r - lw / 2, 0, Math.PI * 2); x.lineWidth = lw; x.strokeStyle = s; x.stroke(); });
    for (let n = 0; n < 12000; n++) { x.fillStyle = `rgba(0,0,0,${Math.random() * .05})`; x.fillRect(Math.random() * W, Math.random() * W, 2, 2); }
  });
  const m = new THREE.Mesh(new THREE.CylinderGeometry(.8, .8, .012, 72), new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }));
  m.position.y = .006; m.receiveShadow = true; const g = new THREE.Group(); g.add(m); g.userData.flat = true; return g;
}
function coffeeTable(o) {
  const g = new THREE.Group(), wd = Mat.wood(o.color);
  const top = cyl(.45, .45, .04, wd, 64); top.position.y = .4; g.add(top);
  const shelf = cyl(.32, .32, .025, wd, 48); shelf.position.y = .14; g.add(shelf);
  for (let i = 0; i < 3; i++) { const a = i * Math.PI * 2 / 3, l = cyl(.022, .016, .38, wd, 12); l.position.set(Math.cos(a) * .3, .19, Math.sin(a) * .3); g.add(l); }
  return g;
}
function sideTable(o) {
  const g = new THREE.Group(), wd = Mat.wood(o.color), mt = Mat.metal('#2b2a29');

  else if (drag && down && down.moved) { const p = floorAt(e.clientX, e.clientY); if (p) { drag.obj.position.set(p.x + drag.off.x, 0, p.z + drag.off.z); dimUntil = performance.now() + 1500; } }
});
function ptrEnd(e) {

  if (ptrs.size) return;

  down = null; drag = null;
}
canvas.addEventListener('pointerup', ptrEnd); canvas.addEventListener('pointercancel', ptrEnd);

/* camera feed + sample room */
const ICO_CAM = '<path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/>';
const ICO_ROOM = '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>';
function setMode(m) {
  mode = m; const cam = m === 'camera';
  video.style.visibility = cam ? 'visible' : 'hidden'; room.visible = !cam; shadowPlane.visible = cam;
  scene.background = cam ? null : col('#d8d0c4');
  $('#modeIco').innerHTML = cam ? ICO_ROOM : ICO_CAM;
}
async function startCamera() {
  if (params.get('room') === '1' || params.get('cam') === '0') { setMode('room'); return; }
  if (stream) { setMode('camera'); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    video.srcObject = stream; await video.play().catch(() => {}); setMode('camera');
  } catch (err) { setMode('room'); }
}
$('#modeBtn').addEventListener('click', () => { if (mode === 'camera') setMode('room'); else if (stream) setMode('camera'); else startCamera(); });

/* phone motion: keeps placed furniture anchored while the phone turns */
let devQ = null, yawFix = null; const zee = new THREE.Vector3(0, 0, 1), q1 = new THREE.Quaternion(-Math.sqrt(.5), 0, 0, Math.sqrt(.5)), q0 = new THREE.Quaternion(), eul = new THREE.Euler(), tgtQ = new THREE.Quaternion(), fixQ = new THREE.Quaternion();
const staticQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(rad(-27), 0, 0, 'YXZ'));
function onOri(e) {
  if (e.beta == null) return;
  const orient = rad((screen.orientation && screen.orientation.angle) || window.orientation || 0);
  devQ = devQ || new THREE.Quaternion();
  eul.set(rad(e.beta), rad(e.alpha || 0), -rad(e.gamma || 0), 'YXZ');
  devQ.setFromEuler(eul).multiply(q1).multiply(q0.setFromAxisAngle(zee, -orient));
}
let oriListening = false;
function listenOri() { if (!oriListening) { oriListening = true; addEventListener('deviceorientation', onOri); } }
function askMotion() {
  if (motionAsked || params.get('still') === '1') return; motionAsked = true;
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') listenOri(); }).catch(() => {});
  } else listenOri();
}

/* loop */
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
function startScan() {
  scanned = false; scanT0 = performance.now(); hint('Move your phone slowly to find the floor', true);
  const c = centerFloor() || new THREE.Vector3(0, 0, -1.7), a = scanGeo.attributes.position.array;
  for (let i = 0; i < SCAN_N; i++) { const r = Math.sqrt(Math.random()) * 2.2, t = Math.random() * Math.PI * 2; a[i * 3] = c.x + Math.cos(t) * r; a[i * 3 + 1] = .004; a[i * 3 + 2] = c.z + Math.sin(t) * r * 1.3; }
  scanGeo.attributes.position.needsUpdate = true; scanGeo.setDrawRange(0, 0); scanMat.opacity = .9; scanPts.visible = true;
}
function enterAR() {
  arOn = true; yawFix = null; resize(); camera.quaternion.copy(staticQ);
  if (!stream && mode === 'camera' && !room.visible) startCamera();
  requestAnimationFrame(() => { updateCamera(1); if (!scanned) startScan(); else if (pending) hint('Floor found. Tap to place'); else hint(null); });
  requestAnimationFrame(loop);
}
function leaveAR() { arOn = false; hint(null); }
function updateCamera(k) {
  if (devQ) {
    if (yawFix === null) { const f = new THREE.Vector3(0, 0, -1).applyQuaternion(devQ); fixQ.setFromAxisAngle(new THREE.Vector3(0, 1, 0), -Math.atan2(-f.x, -f.z)); yawFix = true; }
    tgtQ.copy(fixQ).multiply(devQ); camera.quaternion.slerp(tgtQ, k);
  } else camera.quaternion.slerp(staticQ, k);
}
const dimEl = $('#dim');
function loop(now) {
  if (!arOn) return;
  requestAnimationFrame(loop);
  updateCamera(.35);
  if (!scanned) {
    const k = (now - scanT0) / 1900;
    scanGeo.setDrawRange(0, Math.floor(clamp(k, 0, 1) * SCAN_N));
    if (k >= 1) { scanned = true; hint(pending ? 'Floor found. Tap to place' : null); }
  } else if (scanPts.visible) { scanMat.opacity -= .03; if (scanMat.opacity <= 0) scanPts.visible = false; }
  const c = scanned && pending ? centerFloor() : null;
  reticle.visible = !!c;
  if (c) { reticle.position.set(c.x, .012, c.z); const s = 1 + Math.sin(now / 260) * .06; ringB.scale.set(s, s, s); }
  placed.forEach(o => {
    const ud = o.userData;
    if (ud.anim) { const k = clamp((now - ud.anim) / 480, 0, 1); ud.model.position.y = (1 - easeOutCubic(k)) * .32; ud.model.scale.setScalar(.86 + .14 * easeOutBack(k)); if (ud.blob) ud.blob.material.opacity = .5 * k; if (k >= 1) ud.anim = 0; }
    if (ud.pop) { const k = clamp((now - ud.pop) / 260, 0, 1); ud.model.scale.setScalar(.94 + .06 * easeOutBack(k)); if (ud.blob) ud.blob.material.opacity = .5; if (k >= 1) ud.pop = 0; }
  });
  if (selected && now < dimUntil) {
    tmpV.copy(selected.position); tmpV.y += selected.userData.h + .12; tmpV.project(camera);
    dimEl.textContent = selected.userData.item.dim;
    dimEl.style.left = ((tmpV.x + 1) / 2 * innerWidth) + 'px'; dimEl.style.top = ((1 - tmpV.y) / 2 * innerHeight) + 'px';
    dimEl.classList.toggle('on', tmpV.z < 1);
  } else dimEl.classList.remove('on');
  renderer.render(scene, camera);
}
setMode(params.get('room') === '1' ? 'room' : 'camera');
renderTray();
})();
