<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBC Creative Pages</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --ink:#14171c; --muted:#5e6672; --line:#e3e6eb;
    --accent:#2f6bff; --accent-ink:#fff; --chip:#eef1f6;
    --apps:#7a3cff; --motion:#e0557a; --other:#1f9d74;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#171a20; --ink:#eef0f3; --muted:#9aa3b2; --line:#272b33;
      --accent:#5b8cff; --chip:#22262e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:26px; margin:0 0 4px; letter-spacing:-.2px; }
  .sub { color:var(--muted); margin:0 0 22px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 14px;
    border-radius:999px; cursor:pointer; font:inherit; }
  .tab[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .tab .n { opacity:.6; margin-left:4px; }
  input[type=search] { flex:1; min-width:200px; padding:9px 14px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px;
    display:flex; flex-direction:column; gap:10px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .sec { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; }
  .sec.apps { color:var(--apps); } .sec.motion { color:var(--motion); } .sec.other { color:var(--other); }
  .date { color:var(--muted); font-size:13px; }
  .title { font-weight:650; font-size:16px; margin:0; }
  .q { color:var(--muted); font-size:13px; margin:0; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { background:var(--chip); border-radius:6px; padding:2px 8px; font-size:12px; color:var(--muted); }
  .actions { display:flex; gap:8px; margin-top:auto; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); background:transparent; color:var(--ink); padding:7px 12px;
    border-radius:9px; cursor:pointer; font:inherit; font-size:14px; text-decoration:none; }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .qr { display:none; background:#fff; padding:10px; border-radius:10px; align-self:center; }
  .qr.on { display:block; }
  .empty { color:var(--muted); padding:40px 0; text-align:center; }
  footer { color:var(--muted); font-size:13px; margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SBC Creative Pages</h1>
  <p class="sub">App mockups for screen recording, motion previews and other HTML pages. Open on a phone with the QR code.</p>
  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <input type="search" id="q" placeholder="Search by title, Q, topic, partner…">
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Nothing here yet.</p>
  <footer>Catalog: <a href="catalog.json">catalog.json</a></footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SECTIONS = { all:"All", apps:"App mockups", motion:"Motion", other:"Other" };
let pages = [], section = (location.hash.slice(1) in SECTIONS) ? location.hash.slice(1) : "all";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const abs = p => new URL(p, location.href).href;

function renderTabs() {
  $("tabs").innerHTML = Object.entries(SECTIONS).map(([k, label]) => {
    const n = k === "all" ? pages.length : pages.filter(p => p.section === k).length;
    return `<button class="tab" data-s="${k}" aria-pressed="${k === section}">${label}<span class="n">${n}</span></button>`;
  }).join("");
}

function render() {
  renderTabs();
  const term = $("q").value.trim().toLowerCase();
  const list = pages
    .filter(p => section === "all" || p.section === section)
    .filter(p => !term || [p.title, p.q, p.topic, p.partner, p.platforms, p.path].join(" ").toLowerCase().includes(term))
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  $("empty").hidden = list.length > 0;
  $("grid").innerHTML = list.map((p, i) => `
    <article class="card">
      <div class="top"><span class="sec ${esc(p.section)}">${esc(SECTIONS[p.section] || p.section)}</span><span class="date">${esc(p.date)}</span></div>
      <p class="title">${esc(p.title)}</p>
      ${p.q ? `<p class="q">Q: ${esc(p.q)}</p>` : ""}
      <div class="chips">${[p.topic, p.partner, p.platforms].filter(Boolean).map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>
      <div class="qr" id="qr${i}"></div>
      <div class="actions">
        <a class="btn primary" href="${esc(p.path)}" target="_blank" rel="noopener">Open</a>
        <button class="btn" data-copy="${esc(abs(p.path))}">Copy link</button>
        <button class="btn" data-qr="${i}" data-url="${esc(abs(p.path))}">QR</button>
      </div>
    </article>`).join("");
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.s) { section = t.dataset.s; history.replaceState(null, "", section === "all" ? location.pathname : "#" + section); render(); }
  if (t.dataset.copy) { navigator.clipboard?.writeText(t.dataset.copy).then(() => { t.textContent = "Copied"; setTimeout(() => t.textContent = "Copy link", 1200); }); }
  if (t.dataset.qr) {
    const box = $("qr" + t.dataset.qr);
    if (!box.hasChildNodes() && window.QRCode) new QRCode(box, { text: t.dataset.url, width: 160, height: 160 });
    box.classList.toggle("on");
  }
});
$("q").addEventListener("input", render);

fetch("catalog.json", { cache: "no-store" })
  .then(r => r.json())
  .then(d => { pages = d.pages || []; render(); })
  .catch(() => { $("empty").hidden = false; $("empty").textContent = "Could not load catalog.json."; });
</script>
</body>
</html>
